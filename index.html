<!DOCTYPE html>
<!--
© 2026 Đặng Thanh Bình. Bản quyền thuộc về tác giả đối với phần biên soạn tiếng Việt, ví dụ minh họa, thiết kế và phần mềm khóa học.
Nội dung gốc "Bài giảng: Kiến thức kiểm dịch thực vật và sinh vật gây hại trong kho nông sản" © tác giả tài liệu gốc; các nguồn được tài liệu dẫn (tiêu chuẩn IPPC, tài liệu FAO, văn bản pháp luật Việt Nam) thuộc về tổ chức ban hành tương ứng.
Khóa học là bản diễn giải cho đào tạo, không phải bản dịch chính thức, không phải chương trình chứng nhận.
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="author" content="Đặng Thanh Bình">
<title>PHYTOGUARD ACADEMY · Kiểm dịch thực vật và sâu mọt hại kho</title>
<style>
:root{--bg:#f2f4fb;--card:#fff;--ink:#131c3a;--text:#2b3352;--muted:#66708f;--line:#dfe3f1;--pri:#1557d6;--acc:#f59e0b;--ok:#12824a;--bad:#c62838;--c1:#1557d6;--c2:#19b5e8;--sh:0 6px 22px rgba(19,28,58,.08)}
body.dark{--bg:#0b1124;--card:#141d3a;--ink:#eef1ff;--text:#cdd4ee;--muted:#93a0c6;--line:#27325a;--sh:0 6px 22px rgba(0,0,0,.4);--ok:#4fd08a;--bad:#ff7d8a}
.m1{--c1:#1557d6;--c2:#19b5e8}.m2{--c1:#6d3be0;--c2:#c14fe6}.m3{--c1:#d42f4b;--c2:#ff7a3d}.m4{--c1:#c45a00;--c2:#f5a81c}
.m5{--c1:#078a77;--c2:#25c7a0}.m6{--c1:#1c8a3a;--c2:#86c92a}.m7{--c1:#bf2585;--c2:#f2609c}.m8{--c1:#3a48d0;--c2:#2aa9ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:16px}
h1,h2,h3,h4{color:var(--ink);margin:0 0 .4em;line-height:1.2}
a{color:var(--pri)}body.dark a{color:#8db4ff}
button,select,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--acc);color:#111;padding:8px 14px;border-radius:10px;z-index:99;font-weight:700}
.skip:focus{left:8px}
#app{display:flex;min-height:100%}
/* sidebar */
.side{width:286px;flex:0 0 286px;background:linear-gradient(170deg,#0f1838,#1c1552);color:#dfe5ff;padding:20px 16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:800;letter-spacing:.08em;font-size:17px;color:#fff;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:0}
.brand i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#f59e0b,#f2609c);display:grid;place-items:center;font-style:normal;color:#111;font-size:18px}
.side small{color:#9aa6d6}
.side nav{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;gap:10px;background:none;border:0;color:#dfe5ff;padding:8px 10px;border-radius:12px;text-align:left;width:100%;font-size:14.5px}
.nv:hover,.nv.on{background:rgba(255,255,255,.1)}
.nv b{flex:0 0 28px;height:28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-size:13px}
.nv.done b{background:#12824a}
.sep{height:1px;background:rgba(255,255,255,.14);margin:4px 0}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#f2609c);border-radius:9px;transition:width .4s}
.side footer{margin-top:auto;font-size:12.5px;color:#9aa6d6}
/* top */
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;gap:10px;padding:10px 18px;flex-wrap:wrap}
.top .ttl{font-weight:700;color:var(--ink);flex:1;min-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top input[type=search]{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);color:var(--ink);width:210px;max-width:40vw}
.top select,.btn{border:1px solid var(--line);border-radius:12px;padding:8px 13px;background:var(--card);color:var(--ink);font-weight:600}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.warm{background:linear-gradient(135deg,#f59e0b,#ff7a3d);color:#1a1205;border:0;font-weight:800;padding:12px 20px;font-size:17px;box-shadow:0 8px 20px rgba(245,158,11,.35)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.4);padding:12px 20px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ico{width:40px;padding:8px 0;text-align:center}
#menuBtn{display:none}
.tprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line)}
.tprog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));transition:width .4s}
main{padding:22px 26px 40px;max-width:1240px;width:100%;margin:0 auto;flex:1}
.warnline{background:#fff4d6;color:#6b4a00;border-radius:10px;padding:6px 12px;font-size:13.5px;margin-bottom:12px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:20px}
.note{border-left:5px solid var(--acc);background:var(--card);border-radius:14px;padding:14px 18px;box-shadow:var(--sh)}
.muted{color:var(--muted)}.small{font-size:13.5px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;color:#fff;padding:38px 36px;background:linear-gradient(125deg,#0f1b4d,#3a2bb0 55%,#b0268a);display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:center}
.hero h1{color:#fff;font-size:clamp(28px,4.2vw,50px);font-weight:800}
.hero h1 span{display:block}.hero h1 span:nth-child(2){color:#ffd27a}
.hero p{max-width:60ch;color:#e6e9ff;font-size:17px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.nums{display:flex;gap:26px;flex-wrap:wrap}
.nums b{display:block;font-size:34px;line-height:1}.nums span{font-size:13px;color:#cfd5ff}
.glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
.glow.a{width:340px;height:340px;background:#19b5e8;left:-80px;top:-120px}
.glow.b{width:380px;height:380px;background:#f59e0b;right:-120px;bottom:-180px;animation-duration:22s}
.hero>div:not(.glow),.hero>svg{position:relative}
.hero svg{width:100%;max-width:330px;justify-self:center}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}
.grid8{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:22px 0}
.mcard{background:var(--card);border:0;border-top:5px solid var(--c1);border-radius:18px;box-shadow:var(--sh);padding:16px;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:6px;transition:transform .2s}
.mcard:hover{transform:translateY(-4px)}
.mcard .n{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;display:grid;place-items:center;font-weight:800}
.mcard h3{font-size:17px;margin:4px 0 0}
.mcard .st{margin-top:auto;font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* slide */
.slide{display:flex;flex-direction:column;gap:14px}
.band{position:relative;overflow:hidden;border-radius:20px;color:#fff;padding:24px 150px 24px 28px;background:linear-gradient(100deg,var(--c1) 0%,var(--c1) 58%,var(--c2) 100%);box-shadow:var(--sh)}
.band h1{color:#fff;font-size:clamp(24px,3vw,36px);margin:4px 0 6px}
.band p{margin:0;font-size:17.5px;max-width:70ch;color:#fff}
.band .kick{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.92}
.band .big{position:absolute;right:14px;bottom:-34px;font-size:150px;font-weight:800;line-height:1;color:rgba(255,255,255,.2);pointer-events:none}
.band .shine{position:absolute;top:0;bottom:0;width:120px;left:-160px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);pointer-events:none}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kc{background:color-mix(in srgb,var(--c1) 6%,var(--card));border-top:4px solid var(--c1);border-radius:16px;padding:14px 16px;box-shadow:var(--sh);transition:transform .2s}
.kc:hover{transform:translateY(-3px)}
.kc .n{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-weight:800;font-size:13px;margin-bottom:6px}
.kc h3{font-size:17px;margin:0 0 4px}.kc p{margin:0}
.g2{display:flex;flex-direction:column;gap:14px}
.gb{display:contents}
.ex{order:1;background:color-mix(in srgb,var(--c1) 8%,var(--card));border:2px dashed color-mix(in srgb,var(--c1) 55%,transparent);border-radius:16px;padding:14px 16px 14px 54px;position:relative}
.ex:before{content:"💡";position:absolute;left:16px;top:12px;font-size:24px}
.inter{order:2;background:var(--card);border:2px solid color-mix(in srgb,var(--c1) 40%,transparent);border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
.take{order:3;background:linear-gradient(120deg,#131c3a,#2b2f7a);color:#fff;border-left:6px solid var(--acc);border-radius:16px;padding:14px 18px}
.take b{display:block;font-size:12.5px;letter-spacing:.12em;color:#ffd27a}
.take span{font-size:18px;font-weight:600}
.src{font-size:13.5px;color:var(--muted);margin:0}
.trn{background:#fff7e0;color:#5b4100;border-radius:14px;padding:10px 14px;border:1px solid #f3d489}
body.dark .trn{background:#33290c;color:#ffe3a1;border-color:#6b5514}
details.narr{background:var(--card);border-radius:14px;padding:10px 16px;box-shadow:var(--sh)}
details.narr summary{cursor:pointer;font-weight:700;color:var(--ink)}
details.narr ol{color:var(--muted);font-size:14px}
.snav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--c1);background:transparent;padding:0}
.dot.on{background:linear-gradient(135deg,var(--c1),var(--c2));transform:scale(1.25)}
.dot.seen{background:color-mix(in srgb,var(--c1) 35%,transparent)}
/* interactive */
.inter h4{font-size:14px;color:var(--c1);margin-bottom:8px}body.dark .inter h4{color:var(--c2)}
.flow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.flow button{flex:1;min-width:120px;border:2px solid var(--c1);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;font-weight:700}
.flow button.on{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.flow .ar{align-self:center;color:var(--c1);font-size:22px;font-weight:800}
.out{margin-top:10px;background:color-mix(in srgb,var(--c1) 7%,var(--card));border-radius:12px;padding:10px 12px;min-height:44px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;text-align:left;padding:7px 9px}
table.t td{border-bottom:1px solid var(--line);padding:7px 9px;vertical-align:top}
table.t tr.hl td{background:color-mix(in srgb,var(--c1) 12%,transparent)}
table.t tbody tr{cursor:pointer}
table.t.hide td:last-child{color:transparent;background:repeating-linear-gradient(45deg,var(--line),var(--line) 6px,transparent 6px,transparent 12px)}
table.t.hide tr.hl td:last-child{color:inherit;background:color-mix(in srgb,var(--c1) 12%,transparent)}
.five{display:flex;gap:8px;flex-wrap:wrap}
.five button{flex:1;min-width:92px;border:2px solid var(--c1);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 6px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.five button.on{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.five svg{width:30px;height:30px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frm label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600}
.frm select{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card);color:var(--ink);width:100%}
.tag{font-size:11.5px;letter-spacing:.08em;font-weight:800;color:#8a5a00;background:#ffecc0;border-radius:8px;padding:3px 8px;display:inline-block;margin-top:8px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw label,.ck label{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:600}
.sw label:has(input:checked),.ck label:has(input:checked){border-color:var(--c1);background:color-mix(in srgb,var(--c1) 9%,var(--card))}
.ck{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ord{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ord li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:5px 10px;background:var(--card)}
.ord li span{flex:1;font-weight:600}
.ord button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;width:32px;height:28px}
.sc button.op{display:block;width:100%;text-align:left;margin:6px 0;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px}
.sc button.op.ok{border-color:var(--ok)}.sc button.op.no{border-color:var(--bad)}
.good{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}
/* tts */
.tts{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:10px 14px;margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative;overflow:hidden}
.tts .btn{padding:6px 11px;font-size:14px}
.tts label{font-size:13.5px;display:flex;gap:5px;align-items:center}
.tts select{border:1px solid var(--line);border-radius:10px;padding:5px;background:var(--card);color:var(--ink)}
.tts .stt{font-size:13.5px;font-weight:600;color:var(--ink);margin-left:auto}
.tts .stt.err{color:var(--bad)}
.tts .disc{flex-basis:100%;font-size:12px;color:var(--muted)}
.tts .tp{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--c1),var(--c2));width:0}
/* quiz */
.q{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:16px;margin:14px 0;border-left:5px solid var(--c1)}
.q h3{font-size:17px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0;background:var(--card);color:var(--text);cursor:pointer}
.opt.sel{border-color:var(--pri)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--card))}
.fb{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--bg)}
.score{font-size:54px;font-weight:800;color:var(--ink);line-height:1}
.pill{display:inline-block;border-radius:99px;padding:4px 14px;font-weight:800;color:#fff}
.pill.ok{background:#12824a}.pill.no{background:#c62838}
table.r{width:100%;border-collapse:collapse}table.r th,table.r td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;font-size:14.5px}
.cert{border:3px double var(--pri);border-radius:18px;padding:28px;text-align:center;background:var(--card);margin:18px 0}
.cert h2{letter-spacing:.14em;color:var(--pri)}
.cert input{border:0;border-bottom:2px dashed var(--line);text-align:center;font-size:24px;font-weight:700;width:min(480px,100%);background:transparent;color:var(--ink);padding:4px}
.cert .row{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin:14px 0}
.cert .row b{display:block;font-size:20px;color:var(--ink)}
.sec{margin:18px 0}
.acts2{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
dl.gl dt{font-weight:700;color:var(--ink);margin-top:8px}dl.gl dd{margin:0}
.res a{display:block;padding:10px 14px;border-radius:12px;background:var(--card);box-shadow:var(--sh);margin:8px 0;text-decoration:none;color:var(--text)}
.backdrop{display:none}
/* animations */
@keyframes inR{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sweep{to{left:120%}}
main.anim.fwd>.slide{animation:inR .5s ease both}
main.anim.back>.slide{animation:inL .5s ease both}
main.anim .band .shine{animation:sweep 1.1s .35s ease both}
main.anim .band h1,main.anim .band p{animation:up .45s .15s both}
main.anim .kc{animation:up .45s both}
main.anim .kc:nth-child(1){animation-delay:.25s}main.anim .kc:nth-child(2){animation-delay:.35s}main.anim .kc:nth-child(3){animation-delay:.45s}
main.anim .ex{animation:up .45s .55s both}main.anim .inter{animation:up .45s .65s both}main.anim .take{animation:up .45s .75s both}
main.anim .mcard,main.anim>h1,main.anim>.card,main.anim>.note,main.anim>.hero,main.anim .q{animation:up .45s both}
main.anim .mcard:nth-child(2){animation-delay:.06s}main.anim .mcard:nth-child(3){animation-delay:.12s}main.anim .mcard:nth-child(4){animation-delay:.18s}
main.anim .mcard:nth-child(5){animation-delay:.24s}main.anim .mcard:nth-child(6){animation-delay:.3s}main.anim .mcard:nth-child(7){animation-delay:.36s}main.anim .mcard:nth-child(8){animation-delay:.42s}
/* present */
body.present .side,body.present details.narr,body.present .src,body.present .warnline{display:none}
body.present #app{display:block}
body.present main{max-width:none;padding:14px 26px;height:100vh;overflow:auto}
body.present .top{position:fixed;left:0;right:0;top:0;transform:translateY(-110%);transition:transform .3s}
body.present .tts{position:fixed;left:12px;right:12px;bottom:10px;margin:0;z-index:20;transform:translateY(140%);transition:transform .3s}
body.present.bars .top,body.present.bars .tts{transform:none}
body.present .slide{transform-origin:top left}
@media (min-width:1100px){
 body.present .g2{display:grid;grid-template-columns:1fr 1fr;align-items:stretch}
 body.present .gb{display:flex;flex-direction:column;gap:14px;order:1}
 body.present .inter{order:0}
 body.present .gb .ex,body.present .gb .take{flex:1}
 body.present .g2.noint .ex,body.present .g2.noint .take{display:flex;flex-direction:column;justify-content:center}
 body.present .g2.noint .gb{display:contents}
}
@media (max-width:899px){
 .side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-105%);transition:transform .3s}
 body.menu .side{transform:none}
 body.menu .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
 #menuBtn{display:inline-block}
 .cards,.two,.hero,.frm,.ck{grid-template-columns:1fr}
 .hero{padding:26px 20px}.hero svg{max-width:210px}
 main{padding:16px 14px 40px}
 .band{padding:20px 20px 24px}.band .big{font-size:96px;bottom:-20px;opacity:.7}
 .top .ttl{flex-basis:50%}
 .flow .ar{display:none}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media print{
 *,*:before,*:after{animation:none!important;transition:none!important}
 body{background:#fff}
 .side,.top,.tts,.skip,.backdrop{display:none!important}
 body *{visibility:hidden}
 body:not([data-print=chk]) .cert,body:not([data-print=chk]) .cert *{visibility:visible}
 body:not([data-print=chk]) main>*:not(.cert){display:none}
 body[data-print=chk] .prt,body[data-print=chk] .prt *{visibility:visible}
 body[data-print=chk] main>*:not(:has(.prt)),body[data-print=chk] .slide>*:not(.g2),body[data-print=chk] .g2 .gb{display:none}
