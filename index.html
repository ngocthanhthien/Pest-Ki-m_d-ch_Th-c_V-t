<script id="course-data" type="application/json">{"id":"kdtv-sau-mot-kho-v1","version":"1.0","title":"Kiểm dịch thực vật và sâu mọt hại kho nông sản","subtitle":"Pháp luật kiểm dịch • Sâu mọt hại kho • Quản lý kho nông sản","docName":"Bài giảng: Kiến thức kiểm dịch thực vật và sinh vật gây hại trong kho nông sản (bản phát triển nội dung, tập trung vào kiến thức)","docShort":"Bài giảng KDTV","docOwner":"tác giả tài liệu gốc; các nguồn được tài liệu dẫn (tiêu chuẩn IPPC, tài liệu FAO, văn bản pháp luật Việt Nam) thuộc về tổ chức ban hành tương ứng","source":"Bài giảng: Kiến thức kiểm dịch thực vật và sinh vật gây hại trong kho nông sản · 10/2026 · 10 trang","audience":"QA / QC · Kỹ thuật · Sản xuất · Vệ sinh","duration":"60–80 phút","passPercent":85,"examPerModule":2,"modules":[{"id":1,"title":"Bản chất của kiểm dịch thực vật","description":"Kiểm dịch bảo vệ điều gì, khác gì với kiểm soát côn trùng kho và kiểm soát chất lượng.","duration":"6–8 phút","objective":"Phân biệt ba phạm vi quản lý và hai khái niệm vật thể – đối tượng kiểm dịch."},{"id":2,"title":"Hiểu pháp luật theo chức năng","description":"Tra cứu văn bản theo câu hỏi nghiệp vụ thay vì học thuộc số hiệu.","duration":"6–8 phút","objective":"Biết câu hỏi nào dẫn tới nhóm căn cứ nào và giới hạn của việc chỉ biết ngày hiệu lực."},{"id":3,"title":"Cơ sở sinh học của sâu mọt","description":"Vì sao mọt xuất hiện sau khi nhập kho; nhóm sơ cấp, thứ cấp; bốn yếu tố phát triển.","duration":"7–9 phút","objective":"Giải thích được cơ chế phát sinh và hai điều hay giảng sai về hàng khô, hàng mát."},{"id":4,"title":"Nhận diện: mọt vòi và mọt đục hạt","description":"Mọt gạo, mọt ngô, mọt đục hạt nhỏ và ranh giới giữa sàng lọc với giám định.","duration":"7–9 phút","objective":"Nêu đặc điểm sàng lọc của ba loài gây hại sơ cấp và giới hạn của nhận diện tại kho."},{"id":5,"title":"Nhận diện: nhóm thứ cấp và mọt cà phê","description":"Mọt bột đỏ, mọt răng cưa, mọt cà phê và bảng hệ thống hóa sáu loài.","duration":"7–9 phút","objective":"Liên hệ đặc tính thức ăn của từng loài với nơi cần quan sát trong kho."},{"id":6,"title":"Hiểu đúng dấu hiệu và mức độ","description":"Dấu hiệu, ba cấp độ kết luận và lý do không có một ngưỡng xử lý chung.","duration":"7–9 phút","objective":"Báo cáo đúng mức độ chắc chắn và không suy diễn quy tắc xử lý chung."},{"id":7,"title":"Nguyên lý lấy mẫu","description":"Lấy mẫu là kiểm tra một phần; mẫu đại diện; ý nghĩa của kết quả không phát hiện.","duration":"7–9 phút","objective":"Hiểu giới hạn của kết quả kiểm tra và thông tin bắt buộc đi kèm mẫu."},{"id":8,"title":"Nguyên lý phòng ngừa và kiểm soát","description":"Tác động vào điều kiện tồn tại; bẫy và mẫu hàng; xử lý không thay phòng ngừa.","duration":"7–9 phút","objective":"Giải thích vì sao kiểm soát phải kết hợp nhiều biện pháp và tránh ba nhầm lẫn chính."}],"slides":[{"id":1,"module":1,"title":"Khóa học này nói gì, và không nói gì?","lead":"Ba trục kiến thức: pháp luật kiểm dịch thực vật, sâu mọt hại kho và quản lý kho nông sản.","cards":[{"title":"Trong phạm vi","text":"Khái niệm kiểm dịch, cơ sở sinh học của sâu mọt, nhận diện sơ bộ sáu loài, cách hiểu dấu hiệu, nguyên lý lấy mẫu và kiểm soát."},{"title":"Ngoài phạm vi","text":"Checklist nghiệp vụ, phân công trách nhiệm, kế hoạch hành động và liều lượng, thời gian hun trùng không nằm trong phần kiến thức này."},{"title":"Chỉ là bản diễn giải","text":"Đây là bản diễn giải tiếng Việt cho đào tạo, không phải bản dịch chính thức hay chứng nhận của tổ chức ban hành."}],"example":"(Minh họa) Một nhân viên kho thuộc lòng các bước thao tác nhưng không hiểu lý do. Gặp vài con mọt trong lô ngô, anh ghi ngay “vi phạm kiểm dịch”; lô hàng bị giữ lại nhiều ngày dù chưa ai xác định loài.","takeaway":"Khóa học giải thích “là gì, vì sao”; nó không thay quy trình nghiệp vụ hay kết luận của cơ quan có thẩm quyền.","source":"Phần mở đầu, tr. 1; §9, tr. 9","visual":"","narration":"Bạn đã bao giờ thấy một con mọt trong bao ngô và tự hỏi chuyện này nghiêm trọng đến đâu chưa? Chào mừng bạn đến với khóa học về kiểm dịch thực vật và sâu mọt hại kho. Khóa học đi theo ba trục: pháp luật kiểm dịch, sinh học sâu mọt và quản lý kho nông sản. Chúng ta tập trung vào câu hỏi là gì và vì sao. Các bảng kiểm nghiệp vụ, phân công trách nhiệm và liều lượng xử lý nằm ngoài phạm vi. Xin lưu ý, đây là bản diễn giải tiếng Việt cho đào tạo. Nó không phải bản dịch chính thức, cũng không phải chứng nhận của tổ chức ban hành. Khi cần áp dụng, bạn hãy đối chiếu tài liệu gốc và quy định hiện hành.","trainer":"Hãy hỏi học viên: có quyết định nào ở kho bạn từng làm theo thói quen mà không rõ lý do?"},{"id":2,"module":1,"title":"Kiểm dịch thực vật bảo vệ điều gì?","lead":"Mục tiêu không dừng ở việc lô hàng không có côn trùng nhìn thấy bằng mắt thường.","cards":[{"title":"Ngăn xâm nhập, lan truyền","text":"Kiểm dịch nhằm ngăn sinh vật gây hại thuộc diện quản lý đi theo cây trồng, sản phẩm thực vật và vật thể có thể mang chúng."},{"title":"Hai nhóm dịch hại","text":"Hệ thống theo IPPC ngăn dịch hại kiểm dịch xâm nhập và hạn chế dịch hại thuộc diện điều chỉnh nhưng không phải dịch hại kiểm dịch."},{"title":"Không chỉ mức gây hại","text":"Tình trạng kiểm dịch còn liên quan đến sự hiện diện, phân bố và tình trạng kiểm soát chính thức tại khu vực cần bảo vệ."}],"example":"(Minh họa) Tổ kho soi kỹ mặt bao, không thấy con côn trùng nào nên ghi “đạt kiểm dịch”. Họ quên rằng câu hỏi kiểm dịch là sinh vật thuộc diện quản lý có theo hàng lan sang vùng mới hay không.","takeaway":"Một loài gây tổn thất nặng cho hàng chưa chắc là dịch hại kiểm dịch; mức gây hại không phải tiêu chí duy nhất.","source":"§1.1, tr. 1","visual":"","narration":"Hãy hình dung một cánh cổng ở biên giới. Người gác cổng không đếm xem hàng có bao nhiêu con côn trùng. Họ hỏi một câu khác: có sinh vật nào thuộc diện quản lý đang đi nhờ vào vùng cần bảo vệ không? Đó chính là tinh thần của kiểm dịch thực vật. Mục tiêu là ngăn sinh vật gây hại xâm nhập và lan truyền qua cây trồng, sản phẩm thực vật và các vật thể mang theo chúng. Theo tài liệu, một sinh vật có thể làm hỏng hàng rất nhiều. Nhưng mức gây hại không phải tiêu chí duy nhất. Việc quản lý còn xét sinh vật ấy đã hiện diện, phân bố ra sao và đang được kiểm soát chính thức thế nào.","trainer":"Vì sao một loài mọt rất phổ biến trong kho lại có thể không thuộc diện kiểm dịch?"},{"id":3,"module":1,"title":"Ba phạm vi quản lý: giống mà khác","lead":"Kiểm dịch, kiểm soát côn trùng kho và kiểm soát chất lượng trả lời ba câu hỏi khác nhau.","cards":[{"title":"Kiểm dịch thực vật","text":"Lô hàng có đáp ứng yêu cầu kiểm dịch áp dụng không? Quan tâm sinh vật thuộc diện quản lý và đường lan truyền."},{"title":"Kiểm soát côn trùng kho","text":"Côn trùng có phát sinh, tồn tại hay tăng số lượng trong kho không? Quan tâm nguồn nhiễm, nơi trú ẩn, tổn thất."},{"title":"Kiểm soát chất lượng","text":"Hàng có đạt chỉ tiêu kỹ thuật và yêu cầu thương mại không? Quan tâm độ ẩm, tạp chất, tình trạng hạt, mùi."}],"example":"(Bài giảng KDTV, §1.2) Một lô hàng đạt chỉ tiêu độ ẩm vẫn có thể chứa côn trùng sống. Ngược lại, thấy một loài mọt phổ biến chưa đủ để nói đã phát hiện đối tượng kiểm dịch; phiếu chất lượng đẹp không trả lời hai câu hỏi kia.","takeaway":"Ba phạm vi có liên quan nhưng không thay thế nhau: đạt một phạm vi không có nghĩa đạt hai phạm vi còn lại.","source":"§1.2, tr. 1","visual":"Bảng tóm tắt","interactive":{"type":"table","caption":"Tóm tắt bảng ở §1.2, tr. 1 — ba phạm vi quản lý","head":["Phạm vi","Câu hỏi trung tâm","Quan tâm đến"],"rows":[["Kiểm dịch thực vật","Lô hàng có đáp ứng yêu cầu kiểm dịch áp dụng không?","Sinh vật thuộc diện quản lý, đường lan truyền, yêu cầu của cơ quan có thẩm quyền"],["Kiểm soát côn trùng kho","Côn trùng có phát sinh, tồn tại hoặc tăng số lượng trong kho không?","Nguồn nhiễm, nơi trú ẩn, điều kiện phát triển, tổn thất hàng hóa"],["Kiểm soát chất lượng","Hàng có đáp ứng chỉ tiêu kỹ thuật và yêu cầu thương mại không?","Độ ẩm, tạp chất, tình trạng hạt, mùi và chỉ tiêu quy định cho sản phẩm"]]},"narration":"Một phiếu kiểm tra ghi độ ẩm đạt. Vậy lô hàng ấy đã sạch côn trùng chưa? Chưa chắc. Tài liệu tách ba phạm vi quản lý. Kiểm dịch thực vật hỏi lô hàng có đáp ứng yêu cầu kiểm dịch hay không. Kiểm soát côn trùng kho hỏi côn trùng có phát sinh và tăng lên trong kho hay không. Kiểm soát chất lượng hỏi hàng có đạt chỉ tiêu kỹ thuật và thương mại hay không. Ba câu hỏi này có liên quan, nhưng không thay thế nhau. Hàng đạt độ ẩm vẫn có thể có côn trùng sống. Thấy một loài mọt phổ biến cũng chưa phải là thấy đối tượng kiểm dịch. Mời bạn bấm vào bảng để che cột cuối và tự nhớ lại.","trainer":"Ở cơ sở của bạn, ba phạm vi này do bộ phận nào phụ trách và họ trao đổi thông tin ra sao?"},{"id":4,"module":1,"title":"Lô ngô và con mọt: hai câu hỏi riêng","lead":"“Vật thể thuộc diện kiểm dịch” và “đối tượng kiểm dịch” không phải là một.","cards":[{"title":"Vật thể thuộc diện","text":"Trả lời câu hỏi: hàng hóa hoặc vật thể nào phải chịu sự quản lý kiểm dịch?"},{"title":"Đối tượng kiểm dịch","text":"Trả lời câu hỏi: sinh vật gây hại nào thuộc diện quản lý theo quy định?"},{"title":"Không chỉ là hạt","text":"Theo cách tiếp cận của IPPC, bao bì, phương tiện vận chuyển, container và nơi lưu trữ cũng có thể mang hoặc phát tán sinh vật gây hại."}],"example":"(Bài giảng KDTV, §1.3) Lô ngô là hàng hóa được kiểm tra; con mọt tìm thấy trong lô là sinh vật cần nhận diện. Nếu hồ sơ chỉ ghi tên hàng mà bỏ trống tên loài, kết luận về lô hàng sẽ thiếu hẳn một nửa căn cứ.","takeaway":"Xác định tên hàng không thay cho xác định loài mọt, và ngược lại.","source":"§1.3, tr. 2","visual":"","narration":"Thử nghĩ về một chiếc xe khách và một hành khách trốn vé. Chiếc xe là thứ được kiểm tra. Hành khách kia mới là người cần nhận mặt. Trong kiểm dịch cũng vậy. Vật thể thuộc diện kiểm dịch là hàng hóa phải chịu sự quản lý. Đối tượng kiểm dịch là sinh vật gây hại thuộc diện quản lý. Tài liệu lấy ví dụ lô ngô và con mọt. Lô ngô là hàng được kiểm tra, con mọt là sinh vật cần nhận diện. Không thể lấy tên hàng để suy ra tên loài. Nguy cơ cũng không chỉ nằm trong hạt. Bao bì, phương tiện vận chuyển, thùng chứa hàng và nơi lưu trữ đều có thể mang sinh vật gây hại.","trainer":"Ngoài hạt nông sản, những vật thể nào trong kho của bạn có thể mang sâu mọt đi nơi khác?"},{"id":5,"module":2,"title":"Học luật bằng câu hỏi, không bằng số hiệu","lead":"Phần pháp luật nên đi theo chuỗi câu hỏi nghiệp vụ thay vì một danh sách văn bản.","cards":[{"title":"Vai trò của văn bản","text":"Mỗi nhóm văn bản giữ một vai trò riêng trong quá trình đánh giá lô hàng; hiểu vai trò giúp tra đúng chỗ."},{"title":"Bắt đầu từ tình huống","text":"Đứng trước lô hàng, người làm việc cần biết mình đang hỏi về hàng, về sinh vật, về thủ tục hay về thẩm quyền."},{"title":"Thẩm quyền kết luận","text":"Ai có trách nhiệm và ai được quyền kết luận là câu hỏi do luật và quy định phân công trả lời."}],"example":"(Minh họa) Trưởng ca đọc vanh vách số hiệu năm văn bản. Khi lô cà phê có mọt, anh vẫn không biết phải tra danh mục nào trước, và phải gọi ba cuộc điện thoại mới biết ai được quyền kết luận.","takeaway":"Thuộc số hiệu văn bản không giúp trả lời được câu hỏi của lô hàng trước mặt.","source":"§2.1, tr. 2","visual":"","narration":"Bạn có nhớ số điện thoại của mọi người trong danh bạ không? Chắc là không. Bạn chỉ cần biết muốn gọi ai, rồi tra tên. Học pháp luật kiểm dịch cũng nên như vậy. Tài liệu khuyên không học văn bản chỉ bằng số hiệu. Thay vào đó, hãy bắt đầu từ câu hỏi nghiệp vụ. Hàng này có thuộc diện kiểm dịch không? Sinh vật vừa phát hiện có thuộc diện quản lý không? Ai có thẩm quyền kết luận? Mỗi câu hỏi dẫn tới một nhóm căn cứ cần tra cứu. Khi hiểu vai trò của từng nhóm văn bản, bạn sẽ biết mở đúng trang vào đúng lúc.","trainer":"Cho học viên kể một lần tra nhầm văn bản. Nếu bắt đầu từ câu hỏi nghiệp vụ thì kết quả khác gì?"},{"id":6,"module":2,"title":"Năm câu hỏi mở đúng ngăn tủ hồ sơ","lead":"Mỗi câu hỏi nghiệp vụ tương ứng một nhóm căn cứ cần tra cứu.","cards":[{"title":"Hàng và sinh vật","text":"Hàng thuộc diện kiểm dịch: tra danh mục vật thể. Sinh vật thuộc diện quản lý: tra danh mục đối tượng kiểm dịch kèm kết quả giám định."},{"title":"Nguy cơ nhập khẩu","text":"Hàng nhập khẩu có cần phân tích nguy cơ dịch hại hay không: tra danh mục và quy định về phân tích nguy cơ dịch hại."},{"title":"Cách làm, người làm","text":"Kiểm tra, lấy mẫu, bảo quản mẫu: tra thủ tục và quy chuẩn kỹ thuật. Trách nhiệm, thẩm quyền: tra luật và quy định phân công."}],"example":"(Minh họa) Nhận lô đậu nhập khẩu, cô nhân viên mở ngay quy chuẩn lấy mẫu. Cô lấy mẫu đúng cách, nhưng chưa ai kiểm tra mặt hàng có thuộc danh mục phải phân tích nguy cơ dịch hại hay không, nên hồ sơ bị trả lại.","takeaway":"Danh mục đối tượng kiểm dịch chỉ dùng được khi đã có kết quả giám định sinh vật; không tra bằng phỏng đoán.","source":"§2.1, tr. 2","visual":"Khám phá 5 mục","interactive":{"type":"explore5","caption":"Năm câu hỏi nghiệp vụ và nhóm căn cứ tương ứng — §2.1, tr. 2","items":[{"icon":"box","label":"Hàng","text":"Hàng này có thuộc diện kiểm dịch không? → Tra danh mục vật thể thuộc diện kiểm dịch."},{"icon":"bug","label":"Sinh vật","text":"Sinh vật phát hiện có thuộc diện quản lý không? → Tra danh mục đối tượng kiểm dịch và dựa vào kết quả giám định."},{"icon":"risk","label":"Nguy cơ","text":"Hàng nhập khẩu có cần phân tích nguy cơ dịch hại không? → Tra danh mục và quy định về phân tích nguy cơ dịch hại."},{"icon":"sample","label":"Lấy mẫu","text":"Kiểm tra, lấy mẫu và bảo quản mẫu như thế nào? → Tra quy định thủ tục và quy chuẩn kỹ thuật tương ứng."},{"icon":"person","label":"Thẩm quyền","text":"Ai có trách nhiệm, ai có thẩm quyền kết luận? → Tra luật và quy định phân công trách nhiệm, thẩm quyền."}]},"narration":"Một tủ hồ sơ có năm ngăn. Mở nhầm ngăn, bạn sẽ tìm mãi không ra tờ giấy cần thiết. Tài liệu sắp pháp luật kiểm dịch thành năm câu hỏi như năm ngăn tủ. Câu thứ nhất hỏi hàng có thuộc diện kiểm dịch không. Câu thứ hai hỏi sinh vật phát hiện có thuộc diện quản lý không. Câu thứ ba hỏi hàng nhập khẩu có cần phân tích nguy cơ dịch hại không. Câu thứ tư hỏi cách kiểm tra, lấy mẫu và bảo quản mẫu. Câu thứ năm hỏi ai có trách nhiệm và thẩm quyền kết luận. Mời bạn bấm lần lượt năm nút bên dưới để xem mỗi câu hỏi dẫn tới nhóm căn cứ nào.","trainer":"Chọn một lô hàng thực tế gần đây và cho học viên đi qua đủ năm câu hỏi theo thứ tự."},{"id":7,"module":2,"title":"Thông tư 07/2026: điều gì đã rõ?","lead":"Tài liệu cập nhật thông tin ban hành của một văn bản mà bản gốc còn để ngỏ.","cards":[{"title":"Đã ban hành","text":"Theo tài liệu, Thông tư 07/2026/TT-BNNMT được ban hành và có hiệu lực ngày 23/01/2026 (giá trị tham khảo theo tài liệu)."},{"title":"Nội dung quy định","text":"Thông tư quy định chi tiết một số điều của Luật Bảo vệ và kiểm dịch thực vật và Luật Trồng trọt."},{"title":"Có sửa đổi, bổ sung","text":"Thông tư đồng thời sửa đổi, bổ sung một số thông tư trong lĩnh vực trồng trọt và bảo vệ thực vật."}],"example":"(Minh họa) Bộ slide đào tạo cũ của nhà máy vẫn ghi “thông tư mới, cần kiểm tra thông tin ban hành”. Sau nhiều tháng không ai sửa, học viên mới tưởng văn bản chưa có hiệu lực và bỏ qua khi tra cứu.","takeaway":"Ngày ban hành và hiệu lực là thông tin cần đối chiếu nguồn công bố chính thức, không chép lại từ bài giảng cũ.","source":"§2.2, tr. 2","visual":"","narration":"Bạn có còn giữ tấm lịch năm ngoái trên tường không? Tài liệu đào tạo cũng dễ lỗi thời như thế. Bản gốc của bài giảng từng nhắc một thông tư nhưng còn ghi là cần kiểm tra thông tin ban hành. Tài liệu hiện nay đã cập nhật điểm này. Đó là Thông tư số bảy năm hai nghìn không trăm hai mươi sáu của Bộ Nông nghiệp và Môi trường. Theo tài liệu, thông tư có hiệu lực từ ngày hai mươi ba tháng một năm hai nghìn không trăm hai mươi sáu. Văn bản quy định chi tiết một số điều của hai luật về bảo vệ, kiểm dịch thực vật và trồng trọt. Nó cũng sửa đổi, bổ sung một số thông tư khác trong lĩnh vực này.","trainer":"Tài liệu đào tạo nội bộ của bạn được rà soát căn cứ pháp lý lần cuối khi nào, do ai?"},{"id":8,"module":2,"title":"Biết ngày hiệu lực đã đủ chưa?","lead":"Xác nhận một văn bản còn hiệu lực chưa phải là xác nhận từng điều khoản của nó.","cards":[{"title":"Hai việc khác nhau","text":"Xác nhận ngày hiệu lực không đồng nghĩa đã xác nhận đầy đủ mọi điều khoản sửa đổi."},{"title":"Văn bản được dẫn","text":"Tình trạng hiện hành của toàn bộ các văn bản được dẫn trong bài vẫn cần kiểm tra riêng."},{"title":"Tra đúng điều khoản","text":"Khi nêu yêu cầu bắt buộc cho một loại hàng cụ thể, phải đối chiếu điều khoản tương ứng."}],"example":"(Minh họa) Thấy tên thông tư có chữ “kiểm dịch thực vật”, một nhân viên viết vào quy trình rằng mọi lô hạt điều đều phải làm thủ tục giống nhau. Khách hàng hỏi điều khoản nào quy định, anh không chỉ ra được.","takeaway":"Không suy ra yêu cầu bắt buộc cho một mặt hàng từ tên của thông tư.","source":"§2.2, tr. 2","visual":"","narration":"Giả sử bạn biết một cuốn sách vừa được tái bản. Bạn đã biết trang một trăm viết gì chưa? Tất nhiên là chưa. Với văn bản pháp luật cũng thế. Biết thông tư đã có hiệu lực mới chỉ là bước đầu. Tài liệu nhắc rằng điều đó không có nghĩa đã xác nhận mọi điều khoản sửa đổi. Nó cũng chưa xác nhận tình trạng hiện hành của các văn bản khác được dẫn trong bài. Vì vậy, khi muốn nêu một yêu cầu bắt buộc cho một loại hàng cụ thể, hãy mở đúng điều khoản tương ứng. Đừng suy ra yêu cầu chỉ từ tên của thông tư. Đây là thói quen bảo vệ bạn khi bị hỏi căn cứ.","trainer":"Trong quy trình của cơ sở, câu nào đang ghi “theo quy định” mà chưa dẫn được điều khoản cụ thể?"},{"id":9,"module":3,"title":"Hàng nhập kho sạch, sao lại có mọt?","lead":"Ở mọt chi Sitophilus, ấu trùng lớn lên bên trong hạt nên mắt thường không thấy.","cards":[{"title":"Giai đoạn ẩn","text":"Ấu trùng phát triển bên trong hạt; quan sát bên ngoài có thể không phát hiện giai đoạn đang tồn tại."},{"title":"Không thấy, chưa chắc sạch","text":"Không thấy mọt trưởng thành lúc nhập kho chưa đủ để chứng minh hàng hoàn toàn không nhiễm."},{"title":"Phát hiện khác bắt đầu","text":"Thời điểm phát hiện mọt không nhất thiết là thời điểm bắt đầu nhiễm."}],"example":"(Minh họa) Lô gạo nhập kho được soi kỹ, không thấy con mọt nào. Vài tuần sau mọt bò đầy mặt bao. Thủ kho quy ngay cho lô hàng xếp cạnh mới về hôm qua, trong khi nguồn nhiễm có thể đã nằm sẵn trong hạt.","takeaway":"Đừng kết luận nguồn nhiễm chỉ từ vị trí hoặc ngày phát hiện đầu tiên.","source":"§3.1, tr. 3","visual":"Sơ đồ dòng","interactive":{"type":"flow","caption":"Từ lúc nhiễm đến lúc nhìn thấy — diễn giải §3.1, tr. 3","steps":[{"t":"Nhiễm ban đầu","d":"Thời điểm bắt đầu nhiễm thường không ai nhìn thấy; nó có thể xảy ra trước khi hàng về kho."},{"t":"Ấu trùng trong hạt","d":"Ở mọt chi Sitophilus, ấu trùng phát triển bên trong hạt. Quan sát bề mặt có thể không phát hiện gì."},{"t":"Trưởng thành xuất hiện","d":"Khi côn trùng hoàn thành phát triển và ra bên ngoài, dấu hiệu mới trở nên rõ rệt."},{"t":"Người quản lý phát hiện","d":"Đây là “thời điểm phát hiện”, không phải “nguồn gốc phát sinh”. Hai khái niệm cần ghi tách riêng."}]},"narration":"Bạn mua một túi gạo, nhìn rất sạch. Vài tuần sau, mọt bò ra từ đâu không rõ. Chúng từ đâu tới? Câu trả lời nằm ngay trong hạt gạo. Với nhóm mọt có vòi, ấu trùng lớn lên bên trong hạt. Nhìn từ ngoài, bạn không thấy gì cả. Chỉ khi mọt trưởng thành chui ra, dấu hiệu mới rõ. Tài liệu rút ra hai điều. Thứ nhất, không thấy mọt lúc nhập kho chưa chứng minh hàng không nhiễm. Thứ hai, ngày phát hiện mọt chưa chắc là ngày bắt đầu nhiễm. Vì vậy, đừng vội đổ lỗi cho lô hàng nằm cạnh. Mời bạn bấm từng ô trong sơ đồ để xem diễn biến.","trainer":"Khi điều tra một vụ nhiễm mọt, biên bản của bạn có tách “ngày phát hiện” với “nguồn gốc nghi ngờ” không?"},{"id":10,"module":3,"title":"Nhóm sơ cấp: tấn công cả hạt nguyên","lead":"Phân nhóm theo khả năng khai thác thức ăn, không phải theo tình trạng pháp lý.","cards":[{"title":"Khởi đầu gây hại","text":"Nhóm sơ cấp có thể bắt đầu gây hại trên hạt nguyên, chưa bị tổn thương đáng kể."},{"title":"Ba đại diện","text":"Sitophilus oryzae, Sitophilus zeamais và Rhyzopertha dominica là những đại diện quan trọng trên ngũ cốc bảo quản."},{"title":"Nhìn cả bên trong","text":"Cần quan tâm cả dấu hiệu bên ngoài lẫn khả năng có côn trùng đang phát triển bên trong hạt."}],"example":"(Minh họa) Nhân viên kiểm hàng bốc một nắm ngô, thấy hạt nào cũng tròn đều, bóng đẹp nên ký nhận. Sau một thời gian lưu kho, nhiều hạt trong chính lô ấy xuất hiện lỗ thủng và nhẹ bẫng khi bóp.","takeaway":"Hạt còn nguyên hình dạng không đồng nghĩa hạt chưa bị tấn công.","source":"§3.2, tr. 3","visual":"","narration":"Một quả táo vỏ còn bóng đẹp. Bổ ra, bên trong đã có sâu. Hạt ngũ cốc cũng có thể như vậy. Tài liệu chia sâu mọt kho thành hai nhóm theo cách chúng khai thác thức ăn. Nhóm thứ nhất gọi là gây hại sơ cấp. Chúng có khả năng khởi đầu gây hại ngay trên hạt còn nguyên. Mọt gạo, mọt ngô và mọt đục hạt nhỏ là ba đại diện quan trọng trên ngũ cốc bảo quản. Điều cần nhớ rất ngắn gọn. Hạt còn nguyên hình dạng không có nghĩa là hạt chưa bị tấn công. Xin lưu ý thêm, đây là cách phân nhóm sinh học. Nó không nói gì về tình trạng pháp lý của loài.","trainer":"Tiêu chí nhận hàng của bạn đang dựa vào hình dạng hạt đến mức nào? Điều đó bỏ sót gì?"},{"id":11,"module":3,"title":"“Thứ cấp” có phải là ít quan trọng?","lead":"Nhóm thứ cấp sống nhờ hạt vỡ, bột và phụ phẩm, và vẫn có thể gây tổn thất đáng kể.","cards":[{"title":"Thức ăn ưa thích","text":"Nhóm này thường khai thác hạt đã bị tổn thương, phần vỡ, bột và phụ phẩm."},{"title":"Hai đại diện","text":"Tribolium castaneum và Oryzaephilus surinamensis thường được xếp trong nhóm gây hại thứ cấp."},{"title":"Bụi bột là thức ăn","text":"Bụi bột và nguyên liệu rơi vãi là nguồn thức ăn giúp côn trùng tồn tại và tạo điều kiện nhiễm tiếp diễn."}],"example":"(Minh họa) Kho bột mì được quét lối đi mỗi ngày, nhưng lớp bột đọng dưới chân kệ nhiều tháng không ai đụng tới. Mỗi lô mới về lại thấy côn trùng nâu đỏ bò lên từ đúng những góc đó.","takeaway":"“Thứ cấp” mô tả cách khai thác thức ăn, không có nghĩa mức thiệt hại luôn thấp.","source":"§3.2, tr. 3; §8 câu 4, tr. 9","visual":"","narration":"Trong bếp, vụn bánh rơi dưới gầm tủ là bữa tiệc của kiến. Trong kho, bụi bột và hạt vỡ cũng là bữa tiệc như thế. Tài liệu gọi nhóm côn trùng sống nhờ nguồn này là nhóm gây hại thứ cấp. Chúng thường khai thác hạt đã tổn thương, phần vỡ, bột và phụ phẩm. Mọt bột đỏ và mọt răng cưa là hai đại diện. Vì vậy, bụi bột không chỉ là chuyện vệ sinh cho đẹp mắt. Đó là nguồn thức ăn giúp côn trùng tồn tại và nhiễm tiếp diễn. Và xin đừng hiểu thứ cấp là ít quan trọng. Từ này chỉ mô tả cách khai thác thức ăn. Nhóm này vẫn có thể gây tổn thất đáng kể.","trainer":"Chỉ ra ba vị trí trong kho của bạn mà bột hoặc hạt vỡ có thể tích tụ lâu ngày."},{"id":12,"module":3,"title":"Khô và mát: an toàn tuyệt đối chăng?","lead":"Bốn yếu tố chi phối quần thể côn trùng: thức ăn, nhiệt độ, độ ẩm hạt và thời gian lưu trữ.","cards":[{"title":"Thức ăn và nhiệt độ","text":"Thức ăn quyết định loài nào phát triển, ở đâu. Với nhiều loài, điều kiện quanh 30 °C thuận lợi cho phát triển nhanh (giá trị tham khảo theo tài liệu)."},{"title":"Độ ẩm hạt","text":"Độ ẩm ảnh hưởng đến khả năng phát triển nhưng không tác động giống nhau lên mọi loài."},{"title":"Thời gian lưu trữ","text":"Lưu trữ lâu tạo cơ hội để quần thể phát triển qua các thế hệ khi điều kiện thuận lợi."}],"example":"(Minh họa) Lô lúa mì được sấy khô kỹ và giữ mát suốt mùa lạnh nên kho ngừng kiểm tra côn trùng. Khi hàng chuyển sang khu ấm hơn để chờ sản xuất, mọt xuất hiện trở lại và tăng nhanh.","takeaway":"Hàng khô không đồng nghĩa không có sâu mọt; làm mát chỉ làm chậm, không tiêu diệt hoàn toàn côn trùng.","source":"§3.3, tr. 3–4","visual":"Công tắc điều kiện","interactive":{"type":"switch","caption":"Bật thử các điều kiện bảo quản — diễn giải §3.3, tr. 3–4","toggles":["Hàng đã được làm khô tốt","Hàng đang được làm mát","Thời gian lưu trữ kéo dài"],"results":{"000":"Chưa chọn điều kiện nào. Tài liệu xét đồng thời bốn yếu tố: thức ăn, nhiệt độ, độ ẩm hạt và thời gian lưu trữ.","100":"Làm khô giúp hạn chế, nhưng theo FAO nhiều loài vẫn sống và phát triển được trên ngũ cốc đã làm khô tốt. Vẫn cần kiểm tra côn trùng.","010":"Nhiệt độ thấp làm chậm phát triển chứ không tiêu diệt hoàn toàn. Một số côn trùng tồn tại và có thể phát triển trở lại khi hàng sang điều kiện ấm hơn.","001":"Thời gian dài cho quần thể cơ hội phát triển qua nhiều thế hệ khi điều kiện thuận lợi; quanh 30 °C nhiều loài phát triển nhanh.","110":"Khô và mát đều làm chậm phát triển, nhưng không điều kiện nào là bằng chứng “không có mọt”. Độ ẩm tác động khác nhau lên từng loài.","101":"Hàng khô nhưng lưu lâu: những loài chịu được hạt có độ ẩm thấp, như nhóm mọt đục hạt, vẫn có thời gian để tăng số lượng.","011":"Mát nhưng lưu lâu: phát triển chậm lại, song côn trùng còn tồn tại có thể tăng trở lại khi hàng chuyển sang nơi ấm hơn.","111":"Cả ba điều kiện cùng có: tốc độ phát triển giảm, nhưng theo dõi môi trường vẫn cần đi kèm kiểm tra sinh vật (§7.1)."}},"narration":"Bạn cất bánh quy trong hộp kín, khô ráo. Bạn có dám chắc sẽ không bao giờ có mọt không? Tài liệu giải thích sự phát triển của côn trùng bằng bốn yếu tố. Đó là nguồn thức ăn, nhiệt độ, độ ẩm hạt và thời gian lưu trữ. Với nhiều loài, nhiệt độ quanh ba mươi độ xê thuận lợi cho phát triển nhanh. Có hai điều rất hay bị giảng sai. Thứ nhất, hàng khô không có nghĩa là không có sâu mọt. Nhiều loài vẫn sống được trên ngũ cốc khô tốt. Thứ hai, làm mát không tiêu diệt hoàn toàn côn trùng. Nó chỉ làm chậm, và mọt có thể phát triển trở lại khi ấm lên. Mời bạn bật thử ba công tắc để xem kết quả thay đổi.","trainer":"Kho của bạn có giai đoạn nào hàng chuyển từ nơi mát sang nơi ấm hơn không? Lúc đó ai kiểm tra côn trùng?"},{"id":13,"module":4,"title":"Nhìn hình dáng, biết được đến đâu?","lead":"Dấu hiệu hình thái phục vụ nhận diện sơ bộ tại kho, không thay thế giám định loài.","cards":[{"title":"Sàng lọc tại kho","text":"Các đặc điểm hình thái trong bài giúp khoanh nhóm nghi ngờ ngay tại hiện trường."},{"title":"Giám định chuyên môn","text":"Kết luận tên loài phải dựa trên mẫu sinh vật và phương pháp giám định phù hợp."},{"title":"Loại hàng là gợi ý","text":"Loại hàng nơi tìm thấy côn trùng chỉ là thông tin hỗ trợ, không thay cho đặc điểm giám định."}],"example":"(Minh họa) Thấy côn trùng nhỏ màu nâu trên bao cà phê, tổ trưởng ghi luôn “mọt cà phê” vào sổ. Kết quả giám định sau đó cho ra loài khác, và toàn bộ báo cáo gửi khách hàng phải đính chính.","takeaway":"Nhận ra “thuộc nhóm nào” là sàng lọc; khẳng định “là loài nào” là việc của giám định.","source":"§4 (mở đầu), tr. 4; §4.2, tr. 4","visual":"Bộ chọn","interactive":{"type":"picker","caption":"Tra thử đặc điểm sàng lọc — theo §4.1–4.6, tr. 4–5","features":[{"label":"Có vòi dài; cánh cứng thường có bốn đốm sáng","result":"Hướng sàng lọc: nhóm mọt vòi chi Sitophilus (mọt gạo hoặc mọt ngô). Hai loài gần giống nhau, kích thước có thể chồng lấp."},{"label":"Thân hình trụ; nhìn từ trên, đầu bị tấm ngực che khuất","result":"Hướng sàng lọc: mọt đục hạt nhỏ (Rhyzopertha dominica). Thường kèm lỗ đục và nhiều bột vụn."},{"label":"Thân thon dài, màu nâu đỏ","result":"Hướng sàng lọc: mọt bột đỏ (Tribolium castaneum). Nên mở rộng quan sát sang nơi tích tụ bột, hàng vỡ."},{"label":"Thân dẹt, dài; hai bên ngực có các răng nhỏ","result":"Hướng sàng lọc: mọt răng cưa (Oryzaephilus surinamensis). Thường gặp ở nguyên liệu vỡ vụn, ngũ cốc chế biến, hạt và quả khô."},{"label":"Thân bầu dục, vòi ngắn; cánh có mảng nâu sáng tối","result":"Hướng sàng lọc: mọt cà phê (Araecerus fasciculatus). Lỗ đục trên cà phê chưa đủ để khẳng định loài này."}],"goods":["Gạo","Ngô","Bột, ngũ cốc vỡ","Cà phê, ca cao","Hạt, quả khô"],"goodsNote":"Loại hàng chỉ là thông tin hỗ trợ; nhiều loài gây hại trên cùng một loại hàng.","always":"Đây mới là nhận diện sơ bộ. Kết luận loài cần mẫu sinh vật và giám định phù hợp."},"narration":"Nhìn một người từ xa, bạn đoán được đó là người quen. Nhưng muốn chắc chắn, bạn phải lại gần xem mặt. Nhận diện sâu mọt cũng có hai mức như thế. Tại kho, chúng ta dựa vào hình dáng để nhận diện sơ bộ. Ví dụ có vòi hay không, thân trụ hay thân dẹt. Tài liệu nói rõ các dấu hiệu này không thay thế giám định loài bằng phương pháp chuyên môn. Loại hàng nơi tìm thấy côn trùng cũng chỉ là thông tin hỗ trợ. Nhận ra nhóm là bước sàng lọc. Gọi đúng tên loài là bước giám định. Mời bạn chọn một đặc điểm và một loại hàng trong bộ tra thử bên dưới.","trainer":"Sổ ghi chép của kho đang ghi tên loài hay ghi nhóm nghi ngờ? Ai là người có quyền ghi tên loài?"},{"id":14,"module":4,"title":"Mọt gạo có chỉ ăn gạo?","lead":"Sitophilus oryzae: vòi dài, cánh thường có bốn đốm sáng, lớn lên bên trong hạt.","cards":[{"title":"Dấu hiệu sàng lọc","text":"Con trưởng thành có vòi dài; cánh cứng thường có bốn đốm sáng."},{"title":"Phát triển trong hạt","text":"Hạt có thể bị tiêu hao phần bên trong trước khi xuất hiện lỗ thoát rõ ràng; quan sát bề mặt có giới hạn."},{"title":"Phạm vi ký chủ","text":"Loài này có thể gặp trên gạo và nhiều loại ngũ cốc khác."}],"example":"(Minh họa) Kho chứa lúa mì và ngô cho rằng “mọt gạo” chỉ liên quan kho gạo nên không đưa loài này vào danh sách theo dõi. Khi mọt vòi có đốm sáng xuất hiện trên lúa mì, không ai nhận ra để báo sớm.","takeaway":"Tên thông dụng không đủ để suy ra phạm vi ký chủ: mọt gạo không chỉ gây hại gạo.","source":"§4.1, tr. 4","visual":"","narration":"Cá sấu không phải là cá. Cái tên đôi khi đánh lừa chúng ta. Mọt gạo cũng vậy. Nghe tên, ta tưởng nó chỉ ăn gạo. Thật ra theo tài liệu, loài này có thể gặp trên gạo và nhiều loại ngũ cốc khác. Về hình dáng, con trưởng thành có vòi dài. Cánh cứng thường có bốn đốm sáng. Điểm kiến thức quan trọng nhất là khả năng phát triển bên trong hạt. Hạt có thể bị ăn rỗng dần từ trong ra, trước khi lỗ thoát hiện rõ. Vì vậy, chỉ nhìn bề mặt hạt là chưa đủ để phát hiện nhiễm. Hãy nhớ, tên thông dụng không cho biết phạm vi ký chủ của loài.","trainer":"Những tên gọi thông dụng nào khác trong kho dễ khiến nhân viên hiểu sai về mặt hàng bị hại?"},{"id":15,"module":4,"title":"Mọt trên ngô có chắc là mọt ngô?","lead":"Sitophilus zeamais gần giống mọt gạo và cũng gây hại nhiều loại ngũ cốc.","cards":[{"title":"Hình dạng gần giống","text":"Mọt ngô có hình dạng gần giống mọt gạo; nhìn tại kho rất khó tách hai loài."},{"title":"Kích thước chồng lấp","text":"Kích thước hai loài có thể chồng lấp, nên “con lớn hơn” không phải căn cứ kết luận duy nhất."},{"title":"Nổi bật trên ngô","text":"FAO ghi nhận loài này có vai trò nổi bật trên ngô nhưng cũng xuất hiện trên các ngũ cốc khác."}],"example":"(Bài giảng KDTV, §8 câu 3) Tìm thấy mọt vòi trên ngô chưa đủ để kết luận là mọt ngô, vì nhiều loài cùng gây hại một loại ngũ cốc. Nếu báo cáo ghi sai tên loài, mọi tra cứu danh mục về sau đều lệch.","takeaway":"Phát hiện mọt trên ngô chưa đủ để xác định chắc chắn đó là Sitophilus zeamais.","source":"§4.2, tr. 4; §8 câu 3, tr. 9","visual":"","narration":"Hai anh em sinh đôi đứng cạnh nhau. Bạn có dám gọi tên từng người chỉ vì một người trông cao hơn chút không? Mọt ngô và mọt gạo cũng giống nhau như vậy. Tài liệu lưu ý kích thước của hai loài có thể chồng lấp. Vì thế, không dùng đặc điểm con lớn hơn làm căn cứ duy nhất. Mọt ngô có vai trò nổi bật trên ngô. Nhưng nó cũng xuất hiện trên các ngũ cốc khác. Cho nên thấy mọt trên ngô chưa đủ để nói chắc đó là mọt ngô. Nhận ra một cá thể thuộc nhóm mọt vòi là bước sàng lọc. Phân biệt chính xác hai loài là việc của giám định.","trainer":"Nếu chỉ được ghi một dòng vào sổ khi thấy mọt vòi trên ngô, bạn sẽ ghi thế nào cho đúng mức chắc chắn?"},{"id":16,"module":4,"title":"Hàng khô vẫn bị mọt đục hạt?","lead":"Rhyzopertha dominica: thân hình trụ, đầu khuất dưới tấm ngực, là loài sơ cấp quan trọng.","cards":[{"title":"Dấu hiệu sàng lọc","text":"Thân hình trụ; khi nhìn từ trên, đầu thường bị tấm ngực che khuất."},{"title":"Dấu vết trên hàng","text":"Hàng bị hại có thể có lỗ đục và nhiều bột vụn."},{"title":"Chịu được hạt khô","text":"Nhóm mọt đục hạt vẫn có thể có ý nghĩa đáng kể trên hạt có độ ẩm thấp."}],"example":"(Minh họa) Lô lúa mì có phiếu độ ẩm đạt nên được miễn kiểm tra côn trùng. Khi mở bao, công nhân thấy nhiều bột vụn mịn dưới đáy và những hạt thủng lỗ, kèm côn trùng nhỏ thân trụ không thấy rõ đầu.","takeaway":"Độ ẩm đạt yêu cầu bảo quản không thay thế việc kiểm tra côn trùng.","source":"§4.4, tr. 5","visual":"","narration":"Nhiều người tin rằng mọt chỉ thích hàng ẩm. Hàng khô thì yên tâm. Thật vậy không? Hãy làm quen với mọt đục hạt nhỏ. Thân nó hình trụ. Nhìn từ trên xuống, bạn khó thấy đầu vì bị tấm ngực che khuất. Hàng bị nó gây hại thường có lỗ đục và nhiều bột vụn. Đây là loài gây hại sơ cấp quan trọng trên ngũ cốc. Điều đáng nhớ là nhóm mọt đục hạt vẫn có thể gây hại đáng kể trên hạt có độ ẩm thấp. Tài liệu vì thế kết luận rất rõ. Độ ẩm đạt yêu cầu bảo quản không thay thế việc kiểm tra côn trùng. Hai việc ấy phải đi song song.","trainer":"Có quy định nội bộ nào đang cho phép bỏ kiểm tra côn trùng khi độ ẩm đạt không? Rủi ro là gì?"},{"id":17,"module":5,"title":"Mọt bột đỏ dẫn ta đi tìm ở đâu?","lead":"Tribolium castaneum: thân thon dài, nâu đỏ, đại diện điển hình của nhóm thứ cấp.","cards":[{"title":"Dấu hiệu sàng lọc","text":"Thân thon dài, màu nâu đỏ; thường được chú ý trong bột, ngũ cốc vỡ và nguyên liệu khô."},{"title":"Dấu hiệu đi kèm","text":"Có thể kèm côn trùng lẫn trong bột và suy giảm chất lượng cảm quan."},{"title":"Mở rộng hướng nhìn","text":"Khi phát hiện, cần quan sát cả nơi tích tụ bột, hàng vỡ và nguyên liệu tồn dư, không chỉ bao hàng."}],"example":"(Minh họa) Sau khi thấy mọt nâu đỏ, tổ vệ sinh lau sạch mặt ngoài toàn bộ bao bột rồi báo xong việc. Tuần sau côn trùng lại xuất hiện, vì lớp bột cũ trong khe sàn và gầm băng tải vẫn còn nguyên.","takeaway":"Chỉ làm sạch bề mặt bao hàng có thể bỏ sót nguồn tồn tại của côn trùng trong kho.","source":"§4.3, tr. 5","visual":"","narration":"Thấy một con kiến trên bàn, bạn lau mặt bàn là xong ư? Người có kinh nghiệm sẽ lần theo để tìm chỗ vụn bánh. Mọt bột đỏ cũng đòi hỏi cách nghĩ ấy. Loài này có thân thon dài, màu nâu đỏ. Nó thường được chú ý trong bột, ngũ cốc vỡ và nguyên liệu khô. Đây là đại diện điển hình của nhóm gây hại thứ cấp. Khi phát hiện, đừng chỉ nhìn bao hàng. Hãy mở rộng quan sát sang nơi tích tụ bột, hàng vỡ và nguyên liệu tồn dư. Hiểu đặc tính thức ăn giúp ta giải thích một điều. Chỉ làm sạch bề mặt bao có thể bỏ sót nguồn tồn tại của côn trùng trong kho.","trainer":"Nếu thấy mọt bột đỏ ở khu đóng bao, bạn sẽ kiểm tra thêm ba vị trí nào trước tiên?"},{"id":18,"module":5,"title":"Răng cưa nhỏ, câu chuyện lớn","lead":"Oryzaephilus surinamensis: thân dẹt, dài, hai bên ngực có răng nhỏ.","cards":[{"title":"Dấu hiệu sàng lọc","text":"Thân dẹt, dài; hai bên ngực có các răng nhỏ."},{"title":"Nơi thường gặp","text":"Thường được chú ý ở ngũ cốc chế biến, nguyên liệu vỡ vụn, hạt và quả khô."},{"title":"Liên hệ tình trạng hàng","text":"Phần vỡ và tổn thương của hàng có thể tạo điều kiện cho nhóm này phát triển."}],"example":"(Minh họa) Lô hạt điều có tỷ lệ vỡ cao được chấp nhận vì “chỉ ảnh hưởng ngoại quan”. Sau thời gian lưu kho, chính những thùng nhiều hạt vỡ là nơi đầu tiên xuất hiện côn trùng thân dẹt.","takeaway":"Hạt vỡ không chỉ là chỉ tiêu ngoại quan; đó còn là điều kiện cho nhóm thứ cấp phát triển.","source":"§4.5, tr. 5","visual":"","narration":"Một bức tường có vết nứt nhỏ. Người ta bảo chỉ xấu chút thôi. Nhưng nước sẽ thấm vào từ chính vết nứt ấy. Hạt vỡ trong lô hàng cũng là vết nứt như vậy. Mọt răng cưa có thân dẹt và dài. Hai bên ngực của nó có các răng nhỏ, đúng như tên gọi. Loài này thường được chú ý ở ngũ cốc chế biến, nguyên liệu vỡ vụn, hạt và quả khô. Nó thường được xem là sinh vật gây hại thứ cấp. Tài liệu đề nghị liên hệ đặc tính này với tình trạng hàng. Phần vỡ và tổn thương có thể tạo điều kiện cho mọt phát triển. Vì thế, tỷ lệ vỡ không chỉ là chuyện ngoại quan.","trainer":"Chỉ tiêu tỷ lệ vỡ ở cơ sở bạn hiện chỉ gắn với chất lượng, hay đã gắn với rủi ro côn trùng?"},{"id":19,"module":5,"title":"Lỗ đục trên cà phê: thủ phạm là ai?","lead":"Araecerus fasciculatus: thân bầu dục, vòi ngắn, cánh có mảng nâu sáng tối.","cards":[{"title":"Dấu hiệu sàng lọc","text":"Thân bầu dục, vòi ngắn; cánh có các mảng màu nâu sáng tối."},{"title":"Hàng cần chú ý","text":"Trong phạm vi tài liệu: cà phê, ca cao và một số loại hạt, quả khô; dấu hiệu gồm lỗ đục và bột vụn."},{"title":"Triệu chứng là định hướng","text":"Kết luận loài cần dựa vào mẫu sinh vật và giám định phù hợp."}],"example":"(Minh họa) Thấy vài hạt cà phê nhân có lỗ đục, kho báo khách hàng rằng lô bị “mọt cà phê”. Không ai thu được con côn trùng nào để gửi giám định, nên khi khách yêu cầu bằng chứng thì kho không có.","takeaway":"Không đồng nhất mọi lỗ đục trên cà phê với mọt cà phê.","source":"§4.6, tr. 5","visual":"","narration":"Thấy cửa kính vỡ, bạn có dám nói ngay ai là người ném đá không? Vết vỡ chỉ cho biết có chuyện xảy ra. Lỗ đục trên hạt cà phê cũng như vậy. Mọt cà phê có thân bầu dục và vòi ngắn. Cánh của nó có các mảng màu nâu sáng tối xen nhau. Trong phạm vi tài liệu, cần chú ý loài này trên cà phê, ca cao và một số loại hạt, quả khô. Dấu hiệu được mô tả gồm lỗ đục và bột vụn. Tuy nhiên, tài liệu dặn không nên đồng nhất mọi lỗ đục trên cà phê với loài này. Triệu chứng trên hàng chỉ là thông tin định hướng. Muốn kết luận loài, phải có mẫu sinh vật và giám định phù hợp.","trainer":"Khi thấy triệu chứng trên hàng mà không bắt được côn trùng, quy trình của bạn yêu cầu làm gì tiếp?"},{"id":20,"module":5,"title":"Sáu loài, năm sai lầm cần tránh","lead":"Bảng hệ thống hóa gắn mỗi loài hoặc nhóm với một kiến thức cần nhớ và một sai lầm.","cards":[{"title":"Mọt vòi, mọt đục hạt","text":"Mọt vòi: ấu trùng trong hạt, đừng định danh bằng loại hàng hay kích thước. Mọt đục hạt: đừng nghĩ hàng khô là hết nguy cơ."},{"title":"Hai loài thứ cấp","text":"Mọt bột đỏ: đừng chỉ kiểm tra hạt nguyên hoặc mặt ngoài bao. Mọt răng cưa: đừng kết luận loài chỉ từ màu sắc chung."},{"title":"Mọt cà phê","text":"Cần chú ý trong kho cà phê; hình thái và mẫu sinh vật quan trọng hơn triệu chứng lỗ đục."}],"example":"(Minh họa) Phiếu kiểm tra của một kho chỉ có một ô “có mọt / không mọt”. Suốt một năm, mọi loài đều được ghi chung một chữ, nên không ai nhận ra côn trùng ở khu bột khác hẳn côn trùng ở khu hạt nguyên.","takeaway":"Bảng này giúp sàng lọc và ghi nhớ; nó không biến người đọc thành người giám định.","source":"§4.7, tr. 6","visual":"Bảng tóm tắt","interactive":{"type":"table","caption":"Tóm tắt bảng ở §4.7, tr. 6 — kiến thức cần nhớ và sai lầm cần tránh","head":["Loài hoặc nhóm","Kiến thức cần nhớ","Sai lầm cần tránh"],"rows":[["S. oryzae, S. zeamais","Có vòi; ấu trùng phát triển trong hạt","Định danh chỉ bằng loại hàng hoặc kích thước"],["R. dominica","Thân hình trụ; đầu khó thấy từ phía trên; gây hại hạt nguyên","Cho rằng hàng khô thì không có nguy cơ"],["T. castaneum","Liên quan nhiều đến bột, phần vỡ và nguyên liệu tồn dư","Chỉ kiểm tra hạt nguyên hoặc mặt ngoài bao"],["O. surinamensis","Thân dẹt; có răng hai bên ngực","Kết luận loài chỉ từ màu sắc chung"],["A. fasciculatus","Cần chú ý trong kho cà phê; hình thái và mẫu sinh vật quan trọng","Đồng nhất mọi lỗ đục trên cà phê với mọt cà phê"]]},"narration":"Trước giờ thi, học trò giỏi thường tự kẻ một bảng tóm tắt. Tài liệu cũng làm thế với sáu loài sâu mọt. Mỗi dòng gồm một kiến thức cần nhớ và một sai lầm cần tránh. Với mọt gạo và mọt ngô, đừng định danh chỉ bằng loại hàng hoặc kích thước. Với mọt đục hạt nhỏ, đừng cho rằng hàng khô thì hết nguy cơ. Với mọt bột đỏ, đừng chỉ kiểm tra hạt nguyên hay mặt ngoài bao. Với mọt răng cưa, đừng kết luận loài chỉ từ màu sắc chung. Với mọt cà phê, đừng quy mọi lỗ đục cho nó. Mời bạn bấm nút che cột cuối trong bảng rồi tự nhớ lại từng sai lầm.","trainer":"Che cột “sai lầm cần tránh” và cho từng nhóm học viên điền lại; sai lầm nào hay gặp nhất ở cơ sở?"},{"id":21,"module":6,"title":"Thấy bột vụn, đã biết thủ phạm chưa?","lead":"Mỗi dấu hiệu riêng lẻ có giá trị nhưng chưa đủ để xác định toàn bộ tình trạng lô hàng.","cards":[{"title":"Bốn dấu hiệu thường gặp","text":"Lỗ đục, hạt rỗng, bột vụn và côn trùng trên bao là những dấu hiệu có giá trị."},{"title":"Xem xét đồng thời","text":"Cần đặt dấu hiệu cạnh côn trùng tìm được, tình trạng hạt và vị trí phát hiện."},{"title":"Ghi nhận đầy đủ","text":"Tài liệu gốc yêu cầu ghi hình thái, tình trạng sống hay chết, mã lô và phạm vi ảnh hưởng."}],"example":"(Bài giảng KDTV, §5.1) Bột vụn có thể đi cùng hoạt động của mọt đục hạt, nhưng phải xét cả côn trùng tìm được, tình trạng hạt và vị trí. Một biên bản chỉ ghi “có bột vụn” khiến người đọc sau không biết lô nào, mức nào.","takeaway":"Dấu hiệu cho biết có điều bất thường; nó chưa cho biết nguyên nhân đã được xác định.","source":"§5.1, tr. 6","visual":"","narration":"Bác sĩ thấy bệnh nhân ho. Ho là dấu hiệu, chưa phải là chẩn đoán. Muốn biết bệnh, bác sĩ còn phải khám thêm. Ở kho cũng vậy. Lỗ đục, hạt rỗng, bột vụn và côn trùng trên bao đều là dấu hiệu có giá trị. Nhưng mỗi dấu hiệu riêng lẻ chưa đủ để xác định tình trạng của cả lô. Tài liệu lấy ví dụ về bột vụn. Nó có thể đi cùng hoạt động của mọt đục hạt. Song ta phải xem xét cả côn trùng tìm được, tình trạng hạt và vị trí phát hiện. Hãy ghi nhận hình thái, côn trùng sống hay chết, mã lô và phạm vi ảnh hưởng. Đừng kết luận chỉ từ một triệu chứng.","trainer":"Lấy một biên bản phát hiện côn trùng gần đây: nó có đủ bốn thông tin tài liệu yêu cầu ghi nhận không?"},{"id":22,"module":6,"title":"Ba nấc thang của một kết luận","lead":"Phát hiện dấu hiệu, nhận diện sơ bộ và kết luận chuyên môn là ba cấp độ khác nhau.","cards":[{"title":"Phát hiện bất thường","text":"Có lỗ đục, bột vụn hoặc côn trùng: mới chỉ ghi nhận rằng có dấu hiệu."},{"title":"Nhận diện sơ bộ","text":"Hình thái phù hợp với một nhóm hoặc loài nghi ngờ; dùng từ “nghi” khi báo cáo."},{"title":"Kết luận chuyên môn","text":"Giám định xác định loài và đánh giá theo yêu cầu áp dụng."}],"example":"(Bài giảng KDTV, §5.2) Cụm từ “nghi mọt thuộc chi Sitophilus” thể hiện mức chắc chắn khác hẳn “đã xác định Sitophilus zeamais”. Viết nhầm nấc, người nhận báo cáo có thể ra quyết định về lô hàng trên một điều chưa ai kiểm chứng.","takeaway":"Chữ “nghi” trong báo cáo không phải là thiếu tự tin; đó là ghi đúng mức độ chắc chắn.","source":"§5.2, tr. 6","visual":"Tình huống 2 bước","interactive":{"type":"scenario","caption":"Tình huống: vài con côn trùng có vòi trong mẫu ngô — theo §5.1–5.3, tr. 6","steps":[{"q":"Bước 1 · Bạn ghi vào báo cáo thế nào?","options":[{"t":"Đã xác định Sitophilus zeamais","ok":false,"fb":"Chưa đúng. Đây là kết luận chuyên môn, cần giám định. Hàng là ngô không đủ để gọi tên loài (§4.2, §5.2)."},{"t":"Nghi mọt thuộc chi Sitophilus, chờ giám định","ok":true,"fb":"Đúng. Đây là nấc nhận diện sơ bộ, ghi đúng mức độ chắc chắn (§5.2)."},{"t":"Lô hàng nhiễm đối tượng kiểm dịch","ok":false,"fb":"Chưa đúng. Chưa xác định loài, và không thể mặc định mọi sâu mọt kho là đối tượng kiểm dịch (§8 câu 6)."}]},{"q":"Bước 2 · Việc tiếp theo hợp lý nhất là gì?","options":[{"t":"Hun trùng ngay, vì thấy một con là phải xử lý","ok":false,"fb":"Chưa đúng. Tài liệu không nêu quy tắc chung như vậy; cần xác định loài, loại hàng, mục đích sử dụng và yêu cầu kiểm dịch (§5.3)."},{"t":"Bỏ qua, vì chỉ có vài con","ok":false,"fb":"Chưa đúng. Côn trùng tìm được là dấu hiệu có giá trị và cần được ghi nhận (§5.1)."},{"t":"Ghi hình thái, sống hay chết, mã lô, phạm vi ảnh hưởng và chuyển mẫu giám định","ok":true,"fb":"Đúng. Đó là các thông tin tài liệu yêu cầu ghi nhận trước khi kết luận (§5.1)."}]}]},"narration":"Ngoài đường có tiếng động lạ. Bạn nói có tiếng động, hay nói chắc chắn là xe tải vừa đâm vào cột điện? Hai câu ấy khác nhau rất xa. Tài liệu tách kết luận thành ba cấp độ. Cấp một là phát hiện dấu hiệu bất thường, như lỗ đục hay côn trùng. Cấp hai là nhận diện sơ bộ, khi hình thái phù hợp với một nhóm nghi ngờ. Cấp ba là kết luận chuyên môn, do giám định xác định loài. Viết nghi mọt thuộc nhóm mọt vòi khác hẳn viết đã xác định mọt ngô. Tách ba cấp độ giúp bạn báo cáo chính xác hơn. Mời bạn thử tình huống hai bước bên dưới và chọn cách ghi phù hợp.","trainer":"Cho học viên viết lại một câu báo cáo cũ theo đúng cấp độ kết luận. Câu mới khác gì?"},{"id":23,"module":6,"title":"Thấy một con mọt là phải hun trùng?","lead":"ISPM 31 phân biệt số chấp nhận trong mẫu với mức nhiễm của lô làm phát sinh hành động.","cards":[{"title":"Hai khái niệm","text":"Số cá thể hoặc đơn vị nhiễm được chấp nhận trong mẫu khác với mức nhiễm toàn lô làm phát sinh hành động kiểm dịch."},{"title":"Số chấp nhận bằng không","text":"Nhiều cơ quan bảo vệ thực vật quốc gia đặt số chấp nhận bằng không đối với dịch hại kiểm dịch."},{"title":"Không phải cho mọi loài","text":"Điều đó không có nghĩa mọi côn trùng kho trong mọi bối cảnh đều được đánh giá theo cùng một ngưỡng."}],"example":"(Bài giảng KDTV, §5.3) Tài liệu khuyên không đưa ra quy tắc chung kiểu “thấy một con mọt là phải hun trùng”. Một kho áp dụng đúng câu đó sẽ hun trùng lặp lại nhiều lần mà vẫn chưa biết loài nào, hàng dùng vào việc gì.","takeaway":"Số chấp nhận bằng không áp dụng cho dịch hại kiểm dịch, không tự động áp cho mọi côn trùng kho.","source":"§5.3, tr. 6","visual":"","narration":"Có biển báo cấm dừng xe trước cổng bệnh viện. Vậy có phải mọi con đường đều cấm dừng xe không? Không. Quy tắc phụ thuộc vào nơi chốn và đối tượng. Ngưỡng xử lý sâu mọt cũng vậy. Tiêu chuẩn quốc tế về lấy mẫu lô hàng phân biệt hai điều. Một là số cá thể được chấp nhận trong mẫu. Hai là mức nhiễm của toàn lô làm phát sinh hành động kiểm dịch. Nhiều cơ quan bảo vệ thực vật đặt số chấp nhận bằng không cho dịch hại kiểm dịch. Nhưng điều đó không áp cho mọi côn trùng kho trong mọi bối cảnh. Trước khi kết luận, cần xác định loài, loại hàng, mục đích sử dụng và yêu cầu kiểm dịch liên quan.","trainer":"Cơ sở bạn có quy tắc truyền miệng nào kiểu “thấy là xử lý”? Nó dựa trên căn cứ gì?"},{"id":24,"module":6,"title":"Mọi sâu mọt kho đều là đối tượng kiểm dịch?","lead":"Tình trạng kiểm dịch được xác định theo tiêu chí và danh mục quản lý.","cards":[{"title":"Hai nhóm khác nhau","text":"Cần phân biệt sinh vật gây hại kho với sinh vật thuộc diện quản lý kiểm dịch."},{"title":"Theo tiêu chí, danh mục","text":"Tình trạng kiểm dịch không xác định chỉ bằng khả năng gây hại hàng hóa."},{"title":"Bốn điều cần biết trước","text":"Loài, loại hàng, mục đích sử dụng và yêu cầu kiểm dịch liên quan phải rõ trước khi kết luận."}],"example":"(Minh họa) Nhân viên bán hàng nghe kho báo “có mọt” liền thông báo cho khách rằng lô hàng “dính kiểm dịch”. Khách hoảng hốt hủy đơn, trong khi loài được giám định sau đó là một loài mọt kho phổ biến.","takeaway":"“Có côn trùng” chưa phải là “vi phạm kiểm dịch”; phải xác định loài và yêu cầu áp dụng trước.","source":"§8 câu 6, tr. 9; §5.3, tr. 6","visual":"","narration":"Mọi con chó đều là động vật. Nhưng không phải mọi động vật đều là chó. Quan hệ giữa sâu mọt kho và đối tượng kiểm dịch cũng tương tự. Một loài có thể gây hại hàng trong kho. Điều đó chưa làm cho nó trở thành đối tượng kiểm dịch. Theo tài liệu, tình trạng kiểm dịch được xác định theo tiêu chí và danh mục quản lý. Nó không chỉ dựa vào khả năng gây hại hàng hóa. Vì vậy, đừng nói lô hàng vi phạm kiểm dịch chỉ vì có côn trùng. Hãy trả lời bốn câu trước. Loài nào? Hàng gì? Dùng vào việc gì? Yêu cầu kiểm dịch nào đang áp dụng?","trainer":"Thông tin “có mọt” đi từ kho đến khách hàng qua những ai, và có thể bị nói quá ở khâu nào?"},{"id":25,"module":7,"title":"Nếm một thìa, biết cả nồi canh?","lead":"Lấy mẫu là kiểm tra một phần để đánh giá cả lô, nên cách lấy quan trọng như số lượng.","cards":[{"title":"Mục đích lấy mẫu","text":"ISPM 31 hướng dẫn chọn phương pháp lấy mẫu để kiểm tra hoặc thử nghiệm, nhằm xác minh sự phù hợp với yêu cầu kiểm dịch."},{"title":"Bốn câu hỏi","text":"Lấy từ lô nào, chọn đơn vị mẫu ra sao, muốn phát hiện mức nhiễm nào, phương pháp kiểm tra phát hiện được đến đâu."},{"title":"Ba khái niệm gắn kèm","text":"Các câu hỏi trên gắn với mức phát hiện, hiệu quả phát hiện và mức tin cậy trong ISPM 31."}],"example":"(Minh họa) Kho tự hào vì luôn lấy đủ số bao theo kế hoạch. Nhưng mẫu của hai lô khác nhau bị gộp chung một túi, nên khi kết quả có côn trùng, không ai nói được nó thuộc lô nào.","takeaway":"Câu hỏi không chỉ là “lấy bao nhiêu” mà còn là lấy từ đâu, chọn thế nào và phát hiện được đến đâu.","source":"§6.1, tr. 7","visual":"","narration":"Bạn nếm một thìa để biết cả nồi canh mặn hay nhạt. Nhưng nếu chưa khuấy đều thì sao? Thìa canh ấy có thể đánh lừa bạn. Lấy mẫu lô hàng cũng là kiểm tra một phần để đánh giá toàn bộ. Tiêu chuẩn quốc tế về lấy mẫu yêu cầu phương pháp phải phù hợp mục tiêu phát hiện và đặc điểm lô hàng. Tài liệu nêu bốn câu hỏi. Lấy từ lô nào? Chọn đơn vị mẫu theo cách nào? Muốn phát hiện mức nhiễm nào? Phương pháp kiểm tra phát hiện được sinh vật đến đâu? Như vậy, kiến thức quan trọng không chỉ là lấy bao nhiêu. Cách lấy và khả năng phát hiện cũng quyết định giá trị của kết quả.","trainer":"Kế hoạch lấy mẫu của bạn trả lời được mấy trong bốn câu hỏi của tài liệu?"},{"id":26,"module":7,"title":"Lấy chỗ dễ lấy: tiện nhưng có đúng?","lead":"Mẫu thuận tiện không mặc nhiên là mẫu đại diện cho lô hàng.","cards":[{"title":"Vị trí dễ tiếp cận","text":"Chỉ lấy ở những chỗ dễ với tới có thể không phản ánh đầy đủ tình trạng lô."},{"title":"Giới hạn của quan sát","text":"Với loài phát triển trong hạt, hạn chế còn nằm ở khả năng phát hiện của phương pháp quan sát."},{"title":"Nội bộ và kiểm dịch","text":"Mẫu nội bộ hỗ trợ quản lý chất lượng, phát hiện sớm; mẫu kiểm dịch lấy theo phương pháp và yêu cầu chuyên môn áp dụng."}],"example":"(Minh họa) Kho chỉ rút mẫu ở hàng bao ngoài cùng, ngang tầm tay, và mẫu luôn sạch. Khi dỡ hàng, công nhân phát hiện các bao nằm sâu sát tường có nhiều mọt, nơi chưa lần nào được lấy mẫu.","takeaway":"Kiểm tra nội bộ không tự thay thế việc lấy mẫu hoặc kết luận kiểm dịch của cơ quan có thẩm quyền.","source":"§6.2, tr. 7","visual":"","narration":"Muốn biết cả lớp học có hiểu bài không, thầy giáo chỉ hỏi mấy bạn ngồi bàn đầu. Kết quả có đáng tin không? Chưa chắc. Trong kho, ta cũng hay lấy mẫu ở chỗ dễ với tới. Tài liệu nhắc rằng mẫu thuận tiện không mặc nhiên là mẫu đại diện. Với loài phát triển bên trong hạt, hạn chế còn nằm ở khả năng phát hiện của cách quan sát. Ngoài ra, cần phân biệt hai loại mẫu. Mẫu kiểm tra nội bộ giúp quản lý chất lượng và phát hiện sớm. Mẫu kiểm dịch được lấy theo phương pháp và yêu cầu chuyên môn áp dụng. Việc kiểm tra nội bộ không thay thế kết luận của cơ quan có thẩm quyền.","trainer":"Vẽ sơ đồ kho và đánh dấu những vị trí chưa bao giờ được lấy mẫu. Vì sao?"},{"id":27,"module":7,"title":"“Không phát hiện” nghĩa là gì?","lead":"Kết quả âm tính chỉ nói về phạm vi mẫu và phương pháp đã dùng.","cards":[{"title":"Nghĩa chính xác","text":"Không phát hiện sinh vật trong phạm vi mẫu và phương pháp đã sử dụng."},{"title":"Mức độ bảo đảm","text":"Vì chỉ khảo sát một phần lô, mức bảo đảm phụ thuộc thiết kế lấy mẫu và hiệu quả phát hiện."},{"title":"Lưu ý mọt trong hạt","text":"Không thấy con trưởng thành trên bề mặt không đủ để loại trừ các giai đoạn khác."}],"example":"(Minh họa) Phiếu kiểm tra ghi “không có mọt” và được chuyển cho khách như một lời cam kết. Vài tuần sau khách khiếu nại vì mọt xuất hiện; kho không giải thích được vì phiếu không ghi mẫu lấy ở đâu, kiểm bằng cách nào.","takeaway":"“Không phát hiện” khác với “không tồn tại”.","source":"§6.3, tr. 7; §8 câu 5, tr. 9","visual":"","narration":"Bạn tìm chìa khóa trong túi áo và không thấy. Bạn có dám nói chìa khóa không ở trong nhà không? Bạn chỉ có thể nói là không thấy ở chỗ đã tìm. Kết quả kiểm tra sâu mọt cũng phải được hiểu như vậy. Kết quả âm tính nghĩa là không phát hiện sinh vật trong phạm vi mẫu và phương pháp đã dùng. Lấy mẫu chỉ khảo sát một phần lô. Vì thế, mức bảo đảm phụ thuộc vào thiết kế lấy mẫu và hiệu quả phát hiện. Điều này đặc biệt quan trọng với mọt phát triển bên trong hạt. Không thấy mọt trưởng thành trên bề mặt chưa loại trừ được các giai đoạn khác. Không phát hiện khác với không tồn tại.","trainer":"Phiếu kết quả của bạn đang ghi “không có” hay “không phát hiện”? Sự khác biệt ảnh hưởng gì khi có khiếu nại?"},{"id":28,"module":7,"title":"Một túi mẫu thiếu nhãn có giá trị gì?","lead":"Mẫu chỉ có giá trị truy xuất khi đi kèm thông tin và được bảo quản đúng mục đích giám định.","cards":[{"title":"Năm thông tin gắn mẫu","text":"Mã lô, vị trí lấy, ngày giờ, người thực hiện và tình trạng hàng."},{"title":"Giữ mẫu đúng cách","text":"Mẫu phải được lưu giữ, bảo quản và vận chuyển phù hợp mục đích giám định."},{"title":"Quy chuẩn được dẫn","text":"Tài liệu gốc dẫn QCVN 01-141:2013/BNNPTNT về lấy mẫu và QCVN 01-175:2014/BNNPTNT về lưu giữ, bảo quản, vận chuyển mẫu."}],"example":"(Minh họa) Phòng giám định trả kết quả rõ ràng về loài mọt trong một túi mẫu. Nhưng nhãn túi chỉ ghi “ngô, kho B”. Ba lô ngô cùng nằm ở kho B, và không ai biết kết quả đó thuộc về lô nào.","takeaway":"Thông tin mẫu không phải thủ tục hành chính phụ; đó là sợi dây nối kết quả giám định với đúng lô hàng.","source":"§6.4, tr. 8","visual":"Checklist 6 mục","interactive":{"type":"checklist","caption":"Phiếu tự kiểm thông tin mẫu — theo §6.4, tr. 8","items":["Mã lô được ghi trên mẫu","Vị trí lấy mẫu được ghi rõ","Ngày, giờ lấy mẫu","Người thực hiện lấy mẫu","Tình trạng hàng tại thời điểm lấy","Mẫu được lưu giữ, bảo quản, vận chuyển phù hợp mục đích giám định"]},"narration":"Bạn nhận một phong bì kết quả xét nghiệm nhưng không ghi tên ai. Kết quả ấy dùng được cho người nào? Không cho ai cả. Một túi mẫu thiếu thông tin cũng vô dụng như vậy. Theo tài liệu, mẫu có giá trị truy xuất cần gắn với mã lô, vị trí lấy và ngày giờ. Cần ghi cả người thực hiện và tình trạng hàng. Mẫu còn phải được lưu giữ, bảo quản và vận chuyển phù hợp mục đích giám định. Thông tin mẫu không phải phần hành chính phụ trợ. Đó là căn cứ nối kết quả giám định với đúng lô hàng. Mời bạn đánh dấu sáu mục trong phiếu tự kiểm và in ra nếu cần.","trainer":"Lấy ngẫu nhiên một mẫu đang lưu: nhãn có đủ năm thông tin không? Thiếu mục nào nhiều nhất?"},{"id":29,"module":8,"title":"Diệt con đang thấy đã đủ chưa?","lead":"Kiểm soát phải tác động vào điều kiện tồn tại của côn trùng, không chỉ vào cá thể đang thấy.","cards":[{"title":"Quản lý kho quyết định","text":"FAO nhấn mạnh quản lý kho ảnh hưởng lớn đến sự phát triển và kiểm soát côn trùng."},{"title":"Bốn điều kiện tồn tại","text":"Thức ăn, điều kiện môi trường, thời gian lưu trữ và cách tổ chức bảo quản."},{"title":"Yếu tố nào, việc nấy","text":"Vệ sinh, phân lô, theo dõi môi trường và quản lý hàng tồn đều có cơ sở sinh học riêng."}],"example":"(Minh họa) Kho xịt diệt hết côn trùng nhìn thấy trên tường và coi như xong. Hàng nghi nhiễm vẫn nằm chung khu với hàng mới, bột rơi vãi vẫn còn dưới pallet, và tháng sau côn trùng lại xuất hiện ở đúng khu đó.","takeaway":"Theo dõi nhiệt độ, độ ẩm không thay được kiểm tra sinh vật; hai việc phải kết hợp.","source":"§7.1, tr. 8","visual":"Bảng tóm tắt","interactive":{"type":"table","caption":"Tóm tắt bảng ở §7.1, tr. 8 — yếu tố, ý nghĩa sinh học, liên hệ quản lý kho","head":["Yếu tố","Ý nghĩa sinh học","Liên hệ quản lý kho"],"rows":[["Nguyên liệu rơi vãi, bụi bột","Cung cấp thức ăn, nhất là cho nhóm gây hại thứ cấp","Vệ sinh góp phần loại bỏ nguồn duy trì quần thể"],["Hàng và bao bì nghi nhiễm","Có thể mang côn trùng sang khu vực khác","Phân lô và kiểm soát luồng hàng giúp hạn chế lây nhiễm chéo"],["Điều kiện nhiệt độ, độ ẩm","Ảnh hưởng tốc độ phát triển, khác nhau giữa các loài","Theo dõi môi trường cần kết hợp kiểm tra sinh vật"],["Thời gian lưu trữ","Tạo cơ hội cho quần thể tăng số lượng","Quản lý hàng tồn cần đi cùng giám sát côn trùng"]]},"narration":"Nhổ cỏ mà để lại rễ, cỏ sẽ mọc lại. Diệt những con mọt đang thấy mà để nguyên điều kiện sống của chúng cũng như vậy. Tổ chức Lương thực và Nông nghiệp Liên Hợp Quốc nhấn mạnh vai trò của quản lý kho. Kiểm soát không chỉ là tiêu diệt cá thể đang nhìn thấy. Nó còn liên quan đến thức ăn, môi trường, thời gian lưu trữ và cách tổ chức bảo quản. Bụi bột là thức ăn, nên vệ sinh loại bỏ nguồn nuôi quần thể. Hàng nghi nhiễm có thể mang côn trùng đi, nên cần phân lô và kiểm soát luồng hàng. Mời bạn xem bảng bên dưới và thử che cột cuối để tự nhớ lại.","trainer":"Trong bốn yếu tố của bảng, yếu tố nào ở kho bạn đang được kiểm soát yếu nhất? Bằng chứng là gì?"},{"id":30,"module":8,"title":"Bẫy sạch, hàng có sạch không?","lead":"Bẫy và kiểm tra mẫu hàng trả lời hai câu hỏi khác nhau.","cards":[{"title":"Bẫy giám sát","text":"Bẫy là công cụ giám sát hoạt động côn trùng trong kho, gắn với quản lý khu vực trú ẩn."},{"title":"Mẫu hàng","text":"Kiểm tra mẫu hàng tập trung vào tình trạng của hàng được khảo sát."},{"title":"Dùng cả hai","text":"Tài liệu gốc đưa kiểm tra bẫy vào quản lý kho nhưng vẫn yêu cầu kiểm tra lô hàng và lấy mẫu khi cần."}],"example":"(Minh họa) Ba tuần liền bẫy trong kho không bắt được con nào, nên tổ kho bỏ luôn việc lấy mẫu hàng. Khi xuất lô ngô nằm ở góc xa bẫy, người nhận mở bao và thấy mọt sống trong hạt.","takeaway":"Số côn trùng bắt được trên bẫy không phải kết luận trực tiếp về toàn bộ lượng côn trùng trong lô.","source":"§7.2, tr. 8","visual":"","narration":"Một chiếc máy ghi hình ở cổng cho biết ai đi qua cổng. Nó không cho biết trong từng căn phòng có gì. Bẫy côn trùng cũng giống chiếc máy ấy. Theo tài liệu, bẫy là công cụ giám sát hoạt động của côn trùng trong kho. Còn kiểm tra mẫu hàng tập trung vào tình trạng của chính lô hàng được khảo sát. Hai công cụ trả lời hai câu hỏi khác nhau. Tài liệu gốc đưa kiểm tra bẫy vào quản lý khu vực trú ẩn. Nhưng đồng thời vẫn yêu cầu kiểm tra lô hàng và lấy mẫu khi cần. Vì vậy, đừng coi số con bắt được trên bẫy là kết luận về toàn bộ côn trùng trong lô.","trainer":"Báo cáo bẫy hàng tuần của bạn đang được dùng để quyết định điều gì? Quyết định đó có vượt quá ý nghĩa của bẫy không?"},{"id":31,"module":8,"title":"Hun trùng xong, sao mọt quay lại?","lead":"Xử lý không thay thế phòng ngừa nếu nguồn tái nhiễm vẫn còn trong kho.","cards":[{"title":"Nguồn tái nhiễm","text":"Một lần xử lý không giải quyết hết nếu còn hàng nhiễm, nguyên liệu tồn dư hoặc luồng hàng chưa được kiểm soát."},{"title":"Kết hợp biện pháp","text":"Tài liệu gốc kết hợp vệ sinh, phân lô, kiểm tra và xử lý thay vì chỉ một biện pháp."},{"title":"Nguy cơ kháng thuốc","text":"FAO lưu ý dùng thuốc không hiệu quả có thể góp phần phát sinh tính kháng, trong đó có kháng phosphine."}],"example":"(Minh họa) Kho hun trùng xong, mở cửa nhập ngay lô hàng mới chưa kiểm tra và xếp cạnh góc còn bột tồn. Ít lâu sau mọt xuất hiện trở lại, kho lại hun trùng, và vòng lặp cứ thế kéo dài.","takeaway":"Bài học không đưa liều lượng hay thời gian hun trùng chung, vì chúng không dùng chung cho mọi hàng hóa và điều kiện kho.","source":"§7.3, tr. 8","visual":"","narration":"Bạn lau khô sàn nhà nhưng không khóa vòi nước đang rỉ. Một lúc sau, sàn lại ướt. Xử lý sâu mọt mà bỏ quên nguồn nhiễm cũng vậy. Theo tài liệu, một lần xử lý không giải quyết được mọi nguồn tái nhiễm. Nhất là khi trong kho còn hàng nhiễm, nguyên liệu tồn dư hoặc luồng hàng chưa được kiểm soát. Vì thế cần kết hợp vệ sinh, phân lô, kiểm tra và xử lý. Còn một lưu ý nữa. Dùng thuốc không hiệu quả có thể góp phần phát sinh tính kháng, kể cả kháng phốt phin. Tài liệu không nêu liều lượng hay thời gian hun trùng dùng chung. Những thông số ấy phụ thuộc hàng hóa và điều kiện kho.","trainer":"Sau lần xử lý gần nhất, kho đã làm gì với hàng nghi nhiễm, bột tồn dư và luồng hàng mới về?"},{"id":32,"module":8,"title":"Ba nhầm lẫn mang theo ra khỏi lớp","lead":"Mạch kiến thức đi từ khái niệm đến kiểm soát, để hiểu lý do trước khi học thao tác.","cards":[{"title":"Nhầm lẫn thứ nhất","text":"Phát hiện côn trùng không đồng nghĩa vi phạm kiểm dịch."},{"title":"Nhầm lẫn thứ hai","text":"Không nhìn thấy không đồng nghĩa không nhiễm."},{"title":"Nhầm lẫn thứ ba","text":"Xử lý côn trùng không đồng nghĩa đã hoàn tất yêu cầu kiểm dịch."}],"example":"(Minh họa) Sau khi hun trùng, kho ghi vào hồ sơ xuất hàng rằng lô “đã đạt kiểm dịch”. Cơ quan có thẩm quyền chưa hề kiểm tra lô này, và hồ sơ bị trả về vì kết luận vượt quá thẩm quyền của kho.","takeaway":"Hiểu cơ sở của quyết định trước, rồi mới học thao tác thực hiện.","source":"§9, tr. 9","visual":"Sắp xếp trình tự","interactive":{"type":"order","caption":"Sắp xếp mạch kiến thức đề xuất — theo §9, tr. 9","items":["Khái niệm kiểm dịch","Sinh học sâu mọt","Nhận diện","Hiểu dấu hiệu","Nguyên lý lấy mẫu","Nguyên lý kiểm soát"]},"narration":"Trước khi xuống núi, người leo núi nhìn lại con đường mình đã đi. Chúng ta cũng làm vậy. Khóa học đi từ khái niệm kiểm dịch đến sinh học sâu mọt và nhận diện. Sau đó là hiểu dấu hiệu, nguyên lý lấy mẫu và nguyên lý kiểm soát. Tài liệu mong bạn tránh ba nhầm lẫn. Một, phát hiện côn trùng không đồng nghĩa vi phạm kiểm dịch. Hai, không nhìn thấy không đồng nghĩa không nhiễm. Ba, xử lý côn trùng không đồng nghĩa đã hoàn tất yêu cầu kiểm dịch. Mời bạn sắp xếp lại mạch kiến thức bằng các nút lên xuống. Cảm ơn bạn đã theo dõi đến màn hình cuối cùng. Chúc bạn làm thật tốt bài đánh giá cuối khóa.","trainer":"Trong ba nhầm lẫn, nhầm lẫn nào từng gây hậu quả thực tế ở cơ sở của bạn?"}],"questions":[{"id":1,"module":1,"slide":3,"q":"Một lô hàng đạt chỉ tiêu độ ẩm. Điều nào đúng theo tài liệu?","options":["Lô hàng vẫn có thể chứa côn trùng sống","Lô hàng chắc chắn không có côn trùng","Lô hàng đã đáp ứng yêu cầu kiểm dịch"],"answer":0,"why":"Ba phạm vi quản lý liên quan nhưng không thay thế nhau; hàng đạt độ ẩm vẫn có thể chứa côn trùng sống (§1.2, tr. 1)."},{"id":2,"module":1,"slide":4,"q":"“Đối tượng kiểm dịch” trả lời câu hỏi nào?","options":["Hàng hóa nào phải chịu sự quản lý?","Sinh vật gây hại nào thuộc diện quản lý theo quy định?","Kho nào được phép chứa hàng?"],"answer":1,"why":"Vật thể thuộc diện kiểm dịch nói về hàng hóa, vật thể; đối tượng kiểm dịch nói về sinh vật gây hại thuộc diện quản lý (§1.3, tr. 2)."},{"id":3,"module":1,"slide":2,"q":"Theo tài liệu, tình trạng kiểm dịch của một sinh vật được xác định như thế nào?","options":["Chỉ dựa vào mức độ gây hại cho hàng hóa","Dựa vào số lượng cá thể tìm thấy trong kho","Còn liên quan đến sự hiện diện, phân bố và tình trạng kiểm soát chính thức tại khu vực cần bảo vệ"],"answer":2,"why":"Mức gây hại không phải tiêu chí duy nhất; còn xét sự hiện diện, phân bố và kiểm soát chính thức (§1.1, tr. 1)."},{"id":4,"module":2,"slide":6,"q":"Muốn biết sinh vật vừa phát hiện có thuộc diện quản lý hay không, cần tra nhóm căn cứ nào?","options":["Danh mục vật thể thuộc diện kiểm dịch","Danh mục đối tượng kiểm dịch và kết quả giám định","Quy chuẩn kỹ thuật về lấy mẫu"],"answer":1,"why":"Câu hỏi về sinh vật dẫn tới danh mục đối tượng kiểm dịch, kèm kết quả giám định (§2.1, tr. 2)."},{"id":5,"module":2,"slide":8,"q":"Khi nêu yêu cầu bắt buộc cho một loại hàng cụ thể, cần làm gì?","options":["Suy ra từ tên của thông tư","Chỉ cần biết thông tư còn hiệu lực","Đối chiếu điều khoản tương ứng"],"answer":2,"why":"Xác nhận ngày hiệu lực không đồng nghĩa đã xác nhận mọi điều khoản; phải đối chiếu điều khoản tương ứng (§2.2, tr. 2)."},{"id":6,"module":2,"slide":5,"q":"Tài liệu đề nghị tổ chức phần pháp luật theo cách nào?","options":["Theo chuỗi câu hỏi nghiệp vụ","Theo thứ tự số hiệu văn bản","Theo năm ban hành, từ cũ đến mới"],"answer":0,"why":"Phần pháp luật nên giảng theo câu hỏi nghiệp vụ để hiểu vai trò từng nhóm văn bản (§2.1, tr. 2)."},{"id":7,"module":3,"slide":9,"q":"Vì sao hàng nhập kho trông bình thường nhưng sau đó xuất hiện mọt?","options":["Vì mọt luôn bay từ kho bên cạnh sang","Vì hàng bị ẩm trở lại sau khi nhập","Vì ở mọt chi Sitophilus, ấu trùng phát triển bên trong hạt nên khó thấy từ ngoài"],"answer":2,"why":"Ấu trùng Sitophilus phát triển trong hạt; quan sát bên ngoài có thể không phát hiện (§3.1, tr. 3)."},{"id":8,"module":3,"slide":12,"q":"Phát biểu nào đúng về làm khô và làm mát?","options":["Khô và mát làm hạn chế, làm chậm nhưng không loại trừ hoàn toàn sâu mọt","Hàng khô thì không thể có sâu mọt","Làm mát tiêu diệt hoàn toàn côn trùng"],"answer":0,"why":"Nhiều loài vẫn sống trên ngũ cốc khô tốt; nhiệt độ thấp chỉ làm chậm phát triển (§3.3, tr. 3–4)."},{"id":9,"module":3,"slide":11,"q":"Từ “thứ cấp” trong “nhóm gây hại thứ cấp” có nghĩa là gì?","options":["Mức thiệt hại luôn thấp","Mô tả cách khai thác thức ăn: hạt đã tổn thương, phần vỡ, bột, phụ phẩm","Loài không thuộc diện kiểm dịch"],"answer":1,"why":"Thứ cấp mô tả cách khai thác thức ăn, không phải mức thiệt hại hay tình trạng pháp lý (§3.2, tr. 3; §8 câu 4, tr. 9)."},{"id":10,"module":4,"slide":15,"q":"Tìm thấy mọt có vòi trên ngô. Kết luận nào phù hợp?","options":["Chưa đủ để xác định là mọt ngô; phân biệt loài là việc của giám định","Chắc chắn là mọt ngô vì hàng là ngô","Chắc chắn là mọt ngô nếu con mọt to"],"answer":0,"why":"Hai loài Sitophilus gần giống nhau, kích thước chồng lấp, và cùng gây hại nhiều ngũ cốc (§4.2, tr. 4)."},{"id":11,"module":4,"slide":16,"q":"Điều nào đúng về mọt đục hạt nhỏ (Rhyzopertha dominica)?","options":["Chỉ phát triển trên hàng ẩm","Vẫn có thể có ý nghĩa đáng kể trên hạt có độ ẩm thấp","Thuộc nhóm gây hại thứ cấp"],"answer":1,"why":"Đây là loài sơ cấp; nhóm mọt đục hạt vẫn đáng kể trên hạt độ ẩm thấp nên độ ẩm đạt không thay kiểm tra côn trùng (§4.4, tr. 5)."},{"id":12,"module":4,"slide":14,"q":"Tên gọi “mọt gạo” cho biết điều gì về phạm vi ký chủ?","options":["Loài chỉ gây hại gạo","Loài chỉ gây hại gạo và nếp","Không đủ để suy ra; loài có thể gặp trên nhiều loại ngũ cốc khác"],"answer":2,"why":"Tên thông dụng không đủ để suy ra phạm vi ký chủ (§4.1, tr. 4)."},{"id":13,"module":5,"slide":17,"q":"Khi phát hiện mọt bột đỏ, hướng quan sát nên như thế nào?","options":["Chỉ cần làm sạch mặt ngoài bao hàng","Mở rộng sang nơi tích tụ bột, hàng vỡ và nguyên liệu tồn dư","Chỉ kiểm tra hạt còn nguyên"],"answer":1,"why":"Mọt bột đỏ là loài thứ cấp điển hình; chỉ làm sạch bề mặt bao có thể bỏ sót nguồn tồn tại (§4.3, tr. 5)."},{"id":14,"module":5,"slide":19,"q":"Thấy lỗ đục trên hạt cà phê. Cách hiểu nào đúng?","options":["Đó chắc chắn là mọt cà phê","Lỗ đục không có giá trị thông tin gì","Triệu chứng chỉ là thông tin định hướng; kết luận loài cần mẫu sinh vật và giám định"],"answer":2,"why":"Không đồng nhất mọi lỗ đục trên cà phê với Araecerus fasciculatus (§4.6, tr. 5)."},{"id":15,"module":5,"slide":18,"q":"Đặc điểm sàng lọc nào thuộc về mọt răng cưa?","options":["Thân dẹt, dài; hai bên ngực có các răng nhỏ","Thân hình trụ; đầu bị tấm ngực che khuất","Vòi dài; cánh có bốn đốm sáng"],"answer":0,"why":"Oryzaephilus surinamensis có thân dẹt, dài và răng nhỏ hai bên ngực (§4.5, tr. 5)."},{"id":16,"module":6,"slide":22,"q":"Cụm từ “nghi mọt thuộc chi Sitophilus” thuộc cấp độ kết luận nào?","options":["Kết luận chuyên môn","Phát hiện dấu hiệu bất thường","Nhận diện sơ bộ"],"answer":2,"why":"Nhận diện sơ bộ là khi hình thái phù hợp với nhóm hoặc loài nghi ngờ; kết luận chuyên môn cần giám định (§5.2, tr. 6)."},{"id":17,"module":6,"slide":23,"q":"Vì sao không nên dạy quy tắc “thấy một con mọt là phải hun trùng”?","options":["Vì cần xác định loài, loại hàng, mục đích sử dụng và yêu cầu kiểm dịch trước khi kết luận","Vì một con mọt không bao giờ đáng quan tâm","Vì hun trùng đã bị cấm hoàn toàn"],"answer":0,"why":"Không phải mọi côn trùng kho trong mọi bối cảnh đều được đánh giá theo cùng một ngưỡng (§5.3, tr. 6)."},{"id":18,"module":6,"slide":21,"q":"Khi phát hiện bột vụn trong lô hàng, cần làm gì theo tài liệu?","options":["Kết luận ngay lô bị mọt đục hạt","Xem xét đồng thời côn trùng tìm được, tình trạng hạt, vị trí; ghi hình thái, sống hay chết, mã lô, phạm vi ảnh hưởng","Bỏ qua vì bột vụn chỉ là vấn đề vệ sinh"],"answer":1,"why":"Mỗi dấu hiệu riêng lẻ chưa đủ để xác định toàn bộ tình trạng lô hàng (§5.1, tr. 6)."},{"id":19,"module":7,"slide":27,"q":"Kết quả mẫu “không phát hiện côn trùng” có nghĩa là gì?","options":["Không phát hiện trong phạm vi mẫu và phương pháp đã dùng","Toàn bộ lô hàng không nhiễm","Lô hàng đã đạt yêu cầu kiểm dịch"],"answer":0,"why":"Lấy mẫu chỉ khảo sát một phần lô; mức bảo đảm phụ thuộc thiết kế lấy mẫu và hiệu quả phát hiện (§6.3, tr. 7)."},{"id":20,"module":7,"slide":26,"q":"Mẫu kiểm tra nội bộ có vai trò gì?","options":["Thay thế kết luận kiểm dịch của cơ quan có thẩm quyền","Hỗ trợ quản lý chất lượng và phát hiện sớm","Luôn là mẫu đại diện nếu lấy ở chỗ dễ tiếp cận"],"answer":1,"why":"Kiểm tra nội bộ không tự thay thế việc lấy mẫu hoặc kết luận kiểm dịch của cơ quan có thẩm quyền (§6.2, tr. 7)."},{"id":21,"module":7,"slide":28,"q":"Vì sao thông tin đi kèm mẫu quan trọng?","options":["Chỉ để đủ thủ tục hành chính","Để mẫu trông chuyên nghiệp hơn","Vì đó là căn cứ nối kết quả giám định với đúng lô hàng"],"answer":2,"why":"Mẫu cần gắn mã lô, vị trí, ngày giờ, người thực hiện, tình trạng hàng để truy xuất (§6.4, tr. 8)."},{"id":22,"module":8,"slide":30,"q":"Số côn trùng bắt được trên bẫy cho biết điều gì?","options":["Tổng lượng côn trùng trong lô hàng","Hoạt động của côn trùng trong kho, không phải kết luận trực tiếp về toàn bộ lô","Lô hàng có đạt kiểm dịch hay không"],"answer":1,"why":"Bẫy giám sát hoạt động côn trùng; kiểm tra mẫu hàng mới tập trung vào tình trạng hàng (§7.2, tr. 8)."},{"id":23,"module":8,"slide":31,"q":"Vì sao một lần xử lý không thay thế được phòng ngừa?","options":["Vì thuốc xử lý không có tác dụng gì","Vì xử lý chỉ được làm một lần mỗi năm","Vì nguồn tái nhiễm còn đó nếu vẫn có hàng nhiễm, nguyên liệu tồn dư hoặc luồng hàng chưa kiểm soát"],"answer":2,"why":"Tài liệu kết hợp vệ sinh, phân lô, kiểm tra và xử lý thay vì chỉ một biện pháp (§7.3, tr. 8)."},{"id":24,"module":8,"slide":32,"q":"Phát biểu nào KHÔNG phải là một trong ba nhầm lẫn chính tài liệu muốn tránh?","options":["Vệ sinh loại bỏ nguồn thức ăn duy trì quần thể côn trùng","Phát hiện côn trùng đồng nghĩa vi phạm kiểm dịch","Xử lý côn trùng đồng nghĩa đã hoàn tất yêu cầu kiểm dịch"],"answer":0,"why":"Ba nhầm lẫn: phát hiện là vi phạm; không thấy là không nhiễm; xử lý là hoàn tất kiểm dịch (§9, tr. 9). Vệ sinh loại bỏ nguồn thức ăn là kiến thức đúng (§7.1, tr. 8)."}],"glossary":[{"term":"Kiểm dịch thực vật","def":"Hoạt động quản lý nhằm ngăn sinh vật gây hại thuộc diện quản lý xâm nhập và lan truyền qua cây trồng, sản phẩm thực vật và vật thể mang chúng (§1.1)."},{"term":"Vật thể thuộc diện kiểm dịch","def":"Hàng hóa hoặc vật thể phải chịu sự quản lý; có thể gồm cả bao bì, phương tiện vận chuyển, container, nơi lưu trữ (§1.3)."},{"term":"Đối tượng kiểm dịch","def":"Sinh vật gây hại thuộc diện quản lý theo quy định (§1.3)."},{"term":"Gây hại sơ cấp","def":"Nhóm có khả năng khởi đầu gây hại trên hạt nguyên, chưa bị tổn thương đáng kể (§3.2)."},{"term":"Gây hại thứ cấp","def":"Nhóm thường khai thác hạt đã tổn thương, phần vỡ, bột và phụ phẩm; không có nghĩa thiệt hại luôn thấp (§3.2)."},{"term":"Nhận diện sơ bộ","def":"Dùng đặc điểm hình thái để khoanh nhóm hoặc loài nghi ngờ tại kho; là bước sàng lọc (§4, §5.2)."},{"term":"Giám định","def":"Xác định loài bằng phương pháp chuyên môn phù hợp; cơ sở của kết luận chuyên môn (§5.2)."},{"term":"Phân tích nguy cơ dịch hại","def":"Nhóm quy định cần tra khi hỏi hàng nhập khẩu có phải phân tích nguy cơ hay không (§2.1)."},{"term":"Mẫu đại diện","def":"Mẫu phản ánh được tình trạng lô; mẫu chỉ lấy ở chỗ thuận tiện không mặc nhiên là đại diện (§6.2)."},{"term":"Mức phát hiện, hiệu quả phát hiện, mức tin cậy","def":"Các khái niệm của ISPM 31 gắn với câu hỏi muốn phát hiện mức nhiễm nào và phương pháp phát hiện được đến đâu (§6.1)."},{"term":"Kết quả âm tính","def":"Không phát hiện sinh vật trong phạm vi mẫu và phương pháp đã dùng; khác với không tồn tại (§6.3)."},{"term":"Kháng phosphine","def":"Tính kháng thuốc mà FAO lưu ý có thể phát sinh khi sử dụng thuốc không hiệu quả (§7.3)."}]}</script>
<script>
(function(){

function go(r,dir,keep){
 if(!keep)T.stop();
 var prev=route;route=r;
 if(r.p==='slide'){S.last=r.id;if(mode==='learner'){S.seen[r.id]=1}save()}
 else if(document.body.classList.contains('present'))setPresent(false);

 render(dir);

 var m=$('main'),h='';
 if(!storeOK)h+='<div class="warnline" role="status">Trình duyệt không cho lưu tiến độ. Khóa học vẫn chạy bình thường nhưng tiến độ sẽ mất khi đóng trang.</div>';

}
