  var hay=fold([s.title,s.lead,s.example,s.takeaway].concat(s.cards.map(function(c){return c.title+' '+c.text})).join(' '));
  if(hay.indexOf(q)>=0){n++;h+='<a href="#" class="m'+s.module+'" data-a="slide" data-id="'+s.id+'"><b>'+pad(s.id)+' · '+esc(s.title)+'</b><br><span class="small muted">Bài '+s.module+' · '+esc(s.lead)+'</span></a>'}
 });
 return h+'</div><p role="status" class="muted">'+(q.length<2?'Nhập ít nhất 2 ký tự.':n?n+' màn hình phù hợp.':'Không tìm thấy màn hình phù hợp.')+'</p>';
}

/* ---------- TTS ---------- */
var T=(function(){
 var au=new Audio(),tok=0,ch=[],i=0,state='idle',sid=0,muted=false,err='',timer=0,CL=['tw-ob','gtx'];
 var MAP=[[/IPPC/g,'ai pi pi xi'],[/ISPM/g,'ai ét pi em'],[/FAO/g,'phao'],[/QCVN/g,'quy chuẩn Việt Nam'],[/CIP/g,'xi ai pi'],[/QA/g,'kiu ây'],[/QC/g,'kiu xi'],[/phosphine/gi,'phốt phin'],[/axit/gi,'a xít'],[/container/gi,'công ten nơ'],[/checklist/gi,'bảng kiểm'],[/pallet/gi,'pa lét'],[/Sitophilus/gi,'xi tô phi lút'],[/°C/g,' độ xê'],[/%/g,' phần trăm'],[/[“”"()—–→×\/&]/g,' ']];
 function norm(t){MAP.forEach(function(m){t=t.replace(m[0],m[1])});return t.replace(/\s+/g,' ').trim()}
 function chunks(t){
  var sen=norm(t).match(/[^.!?…]+[.!?…]*/g)||[],out=[],cur='';
  sen.forEach(function(s){s=s.trim();if(!s)return;
   while(s.length>170){var c=s.lastIndexOf(',',170);if(c<60)c=s.lastIndexOf(' ',170);if(c<1)c=170;if(cur){out.push(cur);cur=''}out.push(s.slice(0,c+1).trim());s=s.slice(c+1).trim()}
   if(cur&&(cur+' '+s).length>170){out.push(cur);cur=s}else cur=cur?cur+' '+s:s});
  if(cur)out.push(cur);return out;
 }
 function url(t,c){return 'https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&total=1&idx=0&client='+c+'&q='+encodeURIComponent(t)+'&textlen='+t.length}
 function fail(){state='error';err='Không phát được giọng đọc. Kiểm tra Internet rồi bấm Đọc lại';showBars(true);ui()}
 function play(my,ci){
  if(my!==tok)return;
  if(i>=ch.length){finished(my);return}
  var handled=false;
  function bad(e){if(handled||my!==tok)return;if(e&&e.name==='AbortError')return;handled=true;if(ci<CL.length-1)play(my,ci+1);else fail()}
  au.onended=function(){if(my!==tok)return;i++;ui();play(my,0)};
  au.onerror=function(){bad()};
  au.src=url(ch[i],CL[ci]);au.muted=muted;au.defaultPlaybackRate=S.rate;au.playbackRate=S.rate;
  state='playing';err='';ui();
  var p=au.play();if(p&&p.catch)p.catch(bad);
 }
 function finished(my){
  state='done';ui();
  if(!S.auto||route.p!=='slide')return;
  timer=setTimeout(function(){
   if(my!==tok||route.p!=='slide')return;
   var id=route.id;
   if(id%4===0&&S.stopPrac){go({p:'practice',m:modOf(id)});return}
   if(id>=NS){state='idle';err='Đã đọc hết 32 màn hình.';ui();showBars(true);return}
   go({p:'slide',id:id+1},'fwd',true);speak();
  },900);
 }
 function speak(from){
  tok++;clearTimeout(timer);try{au.pause()}catch(e){}
  if(route.p!=='slide')return;
  sid=route.id;ch=chunks(slide(sid).narration);i=from||0;play(tok,0);
 }
 function stop(){tok++;clearTimeout(timer);try{au.pause();au.removeAttribute('src')}catch(e){}state='idle';err='';i=0;ui()}
 function toggle(){
  if(state==='playing'){au.pause();state='paused';ui()}
  else if(state==='paused'&&sid===route.id){var p=au.play();state='playing';ui();if(p&&p.catch)p.catch(function(){fail()})}
  else speak();
 }
 function setRate(r){S.rate=r;au.playbackRate=r;au.defaultPlaybackRate=r;savePref()}
 function mute(){muted=!muted;au.muted=muted;ui()}
 au.addEventListener('playing',function(){au.playbackRate=S.rate});
 au.addEventListener('timeupdate',function(){var e=$('ttsP');if(e&&ch.length&&sid===route.id){var f=au.duration?au.currentTime/au.duration:0;e.style.width=Math.min(100,(i+f)/ch.length*100)+'%'}});
 function ui(){
  var b=$('ttsPlay');if(!b)return;
  var here=sid===route.id;
  b.textContent=state==='playing'&&here?'Ⅱ Tạm dừng':state==='paused'&&here?'▶ Tiếp tục':'▶ Phát';
  $('ttsMute').textContent=muted?'Bật tiếng':'Tắt tiếng';
  var s=$('ttsS'),n=here&&ch.length?ch.length:chunks(slide(route.id).narration).length;
  s.className='stt'+(state==='error'?' err':'');
  s.textContent=err||('màn hình '+route.id+' · đoạn '+(here&&state!=='idle'?Math.min(i+1,n):0)+'/'+n+(state==='done'&&here?' · đã đọc xong':''));
  if(state==='idle'||!here)$('ttsP').style.width='0';
 }
 function bar(s){
  return '<div class="tts m'+s.module+'" id="tts" role="group" aria-label="Thanh giọng đọc"><button class="btn" data-a="prev" aria-label="Màn hình trước">←</button><button class="btn pri" id="ttsPlay" data-a="t-play">▶ Phát</button><button class="btn" data-a="next" aria-label="Màn hình sau">→</button>'
  +'<button class="btn" data-a="t-again">Đọc lại</button><button class="btn" data-a="t-stop">Dừng</button><button class="btn" id="ttsMute" data-a="t-mute">Tắt tiếng</button>'
  +'<label>Tốc độ <select data-c="rate" aria-label="Tốc độ đọc">'+[0.9,1,1.2,1.4].map(function(r){return '<option value="'+r+'"'+(S.rate===r?' selected':'')+'>'+String(r).replace('.',',')+'×</option>'}).join('')+'</select></label>'
  +'<label><input type="checkbox" data-c="auto"'+(S.auto?' checked':'')+'>Tự chuyển</label><label><input type="checkbox" data-c="stopPrac"'+(S.stopPrac?' checked':'')+'>Dừng ở luyện tập</label>'
  +'<span class="stt" id="ttsS" role="status"></span><span class="disc">Google Translate TTS · Cần Internet. Lời thuyết minh được gửi tới Google; không gửi thông tin học viên.</span><i class="tp" id="ttsP"></i></div>';
 }
 return{speak:speak,stop:stop,toggle:toggle,setRate:setRate,mute:mute,ui:ui,bar:bar,chunks:chunks,state:function(){return state}};
})();

/* ---------- present mode ---------- */
var barT=0,overBar=false,wentFS=false;
function showBars(hold){
 if(!document.body.classList.contains('present'))return;
 document.body.classList.add('bars');clearTimeout(barT);
 if(!hold)barT=setTimeout(function(){if(!overBar&&T.state()!=='error')document.body.classList.remove('bars')},2600);
}
function setPresent(on){
 var b=document.body;if(on===b.classList.contains('present'))return;
 b.classList.toggle('present',on);b.classList.remove('bars');
 if(on){wentFS=false;try{var p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.then)p.then(function(){wentFS=true},function(){})}catch(e){}showBars()}
 else{T.stop();try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}var s=$('slide');if(s)s.style.zoom=''}
 $('presBtn').textContent=on?'Thoát trình chiếu':'Trình chiếu';fitSoon();
}
function fit(){
 var s=$('slide');if(!s)return;
 if(!document.body.classList.contains('present')){s.style.zoom='';return}
 var avail=window.innerHeight-28,z=1;s.style.zoom=1;
 for(var k=0;k<10;k++){var h=s.getBoundingClientRect().height;if(!h)break;
  var nz=Math.max(.5,Math.min(1.7,z*Math.pow(avail/h,.6)));
  if(Math.abs(nz-z)<.003)break;z=nz;s.style.zoom=z}
}
function fitSoon(){fit();requestAnimationFrame(fit)}
window.addEventListener('resize',fitSoon);
document.addEventListener('animationend',function(e){if(e.target.id==='slide'||e.target.classList.contains('take'))fit()});
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&wentFS&&document.body.classList.contains('present'))setPresent(false);fitSoon()});
document.addEventListener('mousemove',function(e){if(e.clientY<70||e.clientY>window.innerHeight-110)showBars()});
document.addEventListener('touchstart',function(){showBars()},{passive:true});
document.addEventListener('mouseover',function(e){var was=overBar;overBar=!!(e.target.closest&&e.target.closest('.top,.tts'));if(overBar)showBars(true);else if(was)showBars()});

/* ---------- actions ---------- */
function nextFrom(){var id=route.id;if(id%4===0)go({p:'practice',m:modOf(id)});else go({p:'slide',id:id+1},'fwd')}
function prevFrom(){var id=route.id;if(id>1)go({p:'slide',id:id-1},'back');else go({p:'home'},'back')}
function reInter(){var s=slide(route.id),e=$('inter');if(e){e.innerHTML=vInter(s);fit()}}
function download(name,text,type){try{var b=new Blob([text],{type:type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000);return true}catch(e){return false}}
function csv(){
 var q=function(v){return '"'+String(v).replace(/"/g,'""')+'"'},L=[['loai','muc','gia_tri_1','gia_tri_2','gia_tri_3','gia_tri_4'].join(',')];
 D.modules.forEach(function(m){L.push(['bai',m.id,q(m.title),seenCount(m.id)+'/4',S.done[m.id]?'hoan_thanh':'chua',''].join(','))});
 S.attempts.forEach(function(a,i){L.push(['luot_danh_gia',i+1,q(a.date),a.score+'/'+a.total,a.pass?'dat':'chua_dat',q(a.code)].join(','))});
 return '﻿'+L.join('\r\n');
}
function act(a,el,ev){
 var s,o,i=+el.getAttribute('data-i');
 switch(a){
 case 'menu':document.body.classList.toggle('menu');break;
 case 'home':go({p:'home'});break;
 case 'mod':var m=+el.getAttribute('data-m');var f=mSlides(m).filter(function(x){return!S.seen[x.id]})[0];go({p:'slide',id:f&&!S.done[m]?f.id:(m-1)*4+1},'fwd');break;
 case 'slide':ev.preventDefault();go({p:'slide',id:+el.getAttribute('data-id')});break;
 case 'exam':go({p:'exam'});break;case 'result':go({p:'result'});break;case 'docs':go({p:'docs'});break;
 case 'dark':S.dark=!S.dark;document.body.classList.toggle('dark',S.dark);savePref();break;
 case 'present':if(document.body.classList.contains('present'))setPresent(false);else{if(route.p!=='slide')go({p:'slide',id:S.last||1},'fwd');setPresent(true)}break;
 case 'auto':go({p:'slide',id:S.last&&S.last<NS?S.last:1},'fwd');setPresent(true);S.auto=true;T.ui();T.speak();break;
 case 'manual':go({p:'slide',id:1},'fwd');break;
 case 'next':nextFrom();break;case 'prev':prevFrom();break;
 case 't-play':T.toggle();break;case 't-again':T.speak();break;case 't-stop':T.stop();break;case 't-mute':T.mute();break;
 case 'i-sel':st(slide(route.id)).sel=i;reInter();break;
 case 'i-hide':o=st(slide(route.id));o.hide=!o.hide;o.sel=-1;reInter();break;
 case 'i-up':case 'i-dn':o=st(slide(route.id));var j=a==='i-up'?i-1:i+1;if(j>=0&&j<o.ord.length){var t=o.ord[i];o.ord[i]=o.ord[j];o.ord[j]=t;o.msg=''}reInter();break;
 case 'i-chk':o=st(slide(route.id));var okN=o.ord.filter(function(v,p){return v===p}).length;o.msg=okN===o.ord.length?'<span class="good">Đúng thứ tự theo §9.</span>':'<span class="badc">Mới đúng vị trí '+okN+'/'+o.ord.length+' mục. Hãy thử lại.</span>';reInter();break;
 case 'i-pick':st(slide(route.id)).pick=i;reInter();break;
 case 'i-nxt':o=st(slide(route.id));o.step++;o.pick=-1;reInter();break;
 case 'i-rst':o=st(slide(route.id));o.step=0;o.pick=-1;reInter();break;
 case 'printchk':document.body.setAttribute('data-print','chk');window.print();break;
 case 'printcert':document.body.setAttribute('data-print','cert');window.print();break;
 case 'pans':var qid=+el.getAttribute('data-q'),mm=route.m;(mode==='trainer'?pracTmp[mm]:S.prac[mm])[qid]=i;save();render();break;
 case 'finish':var fm=+el.getAttribute('data-m');S.done[fm]=1;save();if(fm<8)go({p:'slide',id:fm*4+1},'fwd');else go({p:'exam'});break;
 case 'submit':
  if(!X||Object.keys(X.ans).length<X.qs.length)break;
  var sc=X.qs.filter(function(id){return X.ans[id]===qById(id).answer}).length,d=new Date();
  S.attempts.push({date:today(),score:sc,total:X.qs.length,pass:sc>=needPass(X.qs.length),qs:X.qs,ans:X.ans,code:'PG-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+Math.random().toString(36).slice(2,8).toUpperCase()});
  X=null;save();go({p:'result'});break;
 case 'retake':X=null;go({p:'exam'});break;
 case 'xjson':$('docSt').textContent=download(KEY+'-tien-do.json',JSON.stringify({course:KEY,version:D.version,exported:new Date().toISOString(),progress:S},null,2),'application/json')?'Đã xuất tệp JSON.':'Không xuất được tệp.';break;
 case 'xcsv':$('docSt').textContent=download(KEY+'-tien-do.csv',csv(),'text/csv;charset=utf-8')?'Đã xuất tệp CSV.':'Không xuất được tệp.';break;
 case 'reset':if(window.confirm('Xóa toàn bộ tiến độ, kết quả luyện tập và lịch sử đánh giá trên trình duyệt này?')){S.seen={};S.prac={};S.done={};S.attempts=[];S.chk={};S.name='';S.last=1;X=null;IS={};savePref();go({p:'home'})}break;
 }
}
document.addEventListener('click',function(e){var el=e.target.closest&&e.target.closest('[data-a]');if(el&&!el.disabled)act(el.getAttribute('data-a'),el,e)});
document.addEventListener('change',function(e){
 var el=e.target,c=el.getAttribute&&el.getAttribute('data-c');if(!c)return;var o;
 if(c==='rate')T.setRate(+el.value);
 else if(c==='auto'){S.auto=el.checked;savePref()}
 else if(c==='stopPrac'){S.stopPrac=el.checked;savePref()}
 else if(c==='i-f'){st(slide(route.id)).f=el.value;reInter()}
 else if(c==='i-g'){st(slide(route.id)).g=el.value;reInter()}
 else if(c==='i-sw'){st(slide(route.id)).on[+el.getAttribute('data-i')]=el.checked?1:0;reInter()}
 else if(c==='chk'){var sid=el.getAttribute('data-s');o=S.chk[sid]=S.chk[sid]||[];o[+el.getAttribute('data-i')]=el.checked?1:0;savePref();if(route.p==='slide')reInter();else render()}
 else if(c==='xans'){X.ans[+el.getAttribute('data-q')]=+el.value;var n=Object.keys(X.ans).length;$('subBtn').disabled=n<X.qs.length;$('exSt').textContent='Đã trả lời '+n+'/'+X.qs.length+' câu.';
  [].forEach.call(el.closest('fieldset').querySelectorAll('.opt'),function(l){l.classList.toggle('sel',l.contains(el))})}
});
document.addEventListener('input',function(e){
 if(e.target.id==='search'){searchQ=e.target.value;if(searchQ.trim())go({p:'search'},'');else if(route.p==='search')go({p:'home'},'')}
 else if(e.target.id==='cname'){S.name=e.target.value;savePref()}
});
$('mode').addEventListener('change',function(e){mode=e.target.value;T.stop();render()});
document.addEventListener('keydown',function(e){
 var tg=e.target.tagName,form=/^(INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY|A)$/.test(tg),pres=document.body.classList.contains('present');
 if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr[data-a]')){act(e.target.getAttribute('data-a'),e.target,e);return}
 if(e.key==='Escape'){if(pres)setPresent(false);else T.stop();document.body.classList.remove('menu');return}
 if(route.p!=='slide'||/^(INPUT|SELECT|TEXTAREA)$/.test(tg)||e.ctrlKey||e.altKey||e.metaKey)return;
 if(e.key==='ArrowRight'){e.preventDefault();nextFrom()}
 else if(e.key==='ArrowLeft'){e.preventDefault();prevFrom()}
 else if((e.key===' '||e.code==='Space')&&pres&&!form){e.preventDefault();T.toggle()}
});
window.addEventListener('afterprint',function(){document.body.removeAttribute('data-print')});

load();
document.body.classList.toggle('dark',!!S.dark);
render('fwd');
})();
